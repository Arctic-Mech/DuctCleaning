/* ---------- markup groups: who's signed in, your groups, show/hide by group or person ---------- */
function layersSheet(jobId,{onChange,strokeGroups=[]}={}){
  const body=document.createElement('div');
  const ctl=sheetShell({title:'Markup groups',bodyNode:body,full:true});
  const changed=()=>{if(onChange)onChange();draw();};
  const eye=on=>on?I.eye:I.eyeoff;
  function row(g,mine){
    const vis=groupVisible(g.id),active=mine&&activeGroup().id===g.id;
    return `<div class="lyr${vis?'':' off'}">
      <i class="dot" style="background:${g.color}"></i>
      <button type="button" class="nm"${mine?` data-use="${g.id}"`:''}>${esc(g.name)}${active?'<span>New markups go here</span>':''}</button>
      ${mine?`<button type="button" class="ib" data-edit="${g.id}" aria-label="Rename or delete ${esc(g.name)}">${I.edit}</button>`:''}
      <button type="button" class="ib" data-eye="${g.id}" aria-label="${vis?'Hide':'Show'} ${esc(g.name)}">${eye(vis)}</button></div>`;
  }
  function draw(){
    const used=new Set([...jobMarkers(jobId).map(mkGroupOf),...strokeGroups]);
    const others={};let legacy=false;
    used.forEach(id=>{if(id===LEGACY){legacy=true;return;}const g=groupById(id);if(S.user&&g.ownerId===S.user.id)return;
      (others[g.ownerId||'?']=others[g.ownerId||'?']||[]).push(g);});
    let h=`<div class="lyr-me">${I.user}<span>Signed in as <b>${esc(userName(S.user.id))}</b></span>
        <button type="button" class="btn ghost" id="lySwitch">Switch</button></div>
      <div class="lyr-sec">Your groups</div>`+myGroups().map(g=>row(g,true)).join('')
      +`<button type="button" class="addrow" id="lyNew">${I.plus} New group</button>`;
    Object.keys(others).forEach(o=>{const gs=others[o],anyVis=gs.some(g=>groupVisible(g.id));
      h+=`<div class="lyr-sec lyr-person"><span>${esc(o==='?'?'Unknown':userName(o))}</span>
          <button type="button" class="ib" data-person="${o}" aria-label="${anyVis?'Hide':'Show'} all">${eye(anyVis)}</button></div>`
        +gs.map(g=>row(g,false)).join('');});
    if(legacy)h+=`<div class="lyr-sec">Before names</div>`+row(groupById(LEGACY),false);
    body.innerHTML=h;
    body.querySelector('#lySwitch').onclick=()=>signInSheet(changed);
    body.querySelector('#lyNew').onclick=()=>groupNameSheet(null,name=>{const g=createGroup(name);setActiveGroup(g.id);changed();});
    body.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const id=b.dataset.eye;setGroupsHidden([id],groupVisible(id));changed();});
    body.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{const gs=others[b.dataset.person];
      setGroupsHidden(gs.map(g=>g.id),gs.some(g=>groupVisible(g.id)));changed();});
    body.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{setActiveGroup(b.dataset.use);setGroupsHidden([b.dataset.use],false);changed();});
    body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const g=S.groups.find(x=>x.id===b.dataset.edit);if(g)editGroupSheet(g,changed);});
  }
  draw();
}
function groupNameSheet(g,done){

function editGroupSheet(g,changed){
  const body=document.createElement('div');body.className='actionlist';
  const rn=mkAction(I.edit,'Rename');const del=mkAction(I.trash,'Delete group and its markups','danger');
  body.append(rn,mkDiv(),del);
  const ctl=sheetShell({title:g.name,bodyNode:body});
  rn.onclick=()=>{ctl.close();groupNameSheet(g,v=>{g.name=v;pPut('mkgroups',g).catch(()=>{});changed();});};
  del.onclick=async()=>{ctl.close();
    if(myGroups().length<=1){toast('Keep at least one group — rename it instead');return;}
    const ms=S.markers.filter(m=>m.group===g.id);
    if(!await confirmDialog({title:'Delete group?',message:`“${g.name}” and its ${ms.length} marker${ms.length!==1?'s':''} and drawings will be removed from every job.`,confirmText:'Delete'}))return;
    const jobs=new Set(ms.map(m=>m.jobId));
    ms.forEach(m=>pDel('markers',m.id).catch(()=>{}));S.markers=S.markers.filter(m=>m.group!==g.id);
    try{const st=await strokesByGroup(g.id);for(const s of st)await pDel('strokes',s.id);}catch(e){console.warn(e);}
    S.groups=S.groups.filter(x=>x.id!==g.id);pDel('mkgroups',g.id).catch(()=>{});
    jobs.forEach(j=>renumberAllMarkers(j));
    toast('Group deleted');changed();
  };
}

function drawMenu(d){
  const body=document.createElement('div');body.className='actionlist';
  const ren=mkAction(I.edit,'Rename plan');
  const rep=mkAction(I.upload,'Replace PDF (keep tags)');
  const del=mkAction(I.trash,'Delete plan','danger');
  body.append(ren,rep,mkDiv(),del);
  const repInput=document.createElement('input');repInput.type='file';repInput.accept='application/pdf';repInput.className='sr';
  body.appendChild(repInput);
  const ctl=sheetShell({title:esc(d.name),bodyNode:body});
  ren.onclick=()=>{ctl.close();renamePlan(d);};
  rep.onclick=()=>repInput.click();
  repInput.onchange=async()=>{const f=repInput.files[0];repInput.value='';if(f){ctl.close();await replacePlanPdf(d,f);}};
  del.onclick=async()=>{ctl.close();
    const n=drawReports(d.id).length;
    if(await confirmDialog({title:'Delete plan?',message:'This deletes "'+d.name+'"'+(n?' and its '+n+' report'+(n!==1?'s':''):'')+'.',confirmText:'Delete plan'})){
      for(const r of drawReports(d.id)){
        try{const ids=[...(r.before||[]),...(r.after||[])];for(const id of ids)await pDel('photos',id);}catch(e){console.warn(e);}
        await pDel('reports',r.id);
      }
      S.reports=S.reports.filter(r=>r.drawId!==d.id);
      for(const m of drawMarkers(d.id))await pDel('markers',m.id);
      S.markers=S.markers.filter(m=>m.drawId!==d.id);renumberAllMarkers(d.jobId);
      try{const st=await strokesByDraw(d.id);for(const s of st)await pDel('strokes',s.id);}catch(e){console.warn(e);}
      await pDel('drawings',d.id);S.drawings=S.drawings.filter(x=>x.id!==d.id);
      if(d.pdfKey)await deletePdfKeyIfUnused(d.pdfKey);
      else{try{const ts=await pdfChunksByDraw(d.id);for(const t of ts)await pDel('pdfchunks',t.id);}catch(e){console.warn(e);}}
      VW=null;back();toast('Plan deleted');
    }};
}

  const foot=document.createElement('button');foot.className='btn primary block';foot.textContent='Save';

// swap a plan's PDF (e.g. a clean markup-free copy) while keeping the same plan id,
// so every pin/report stays exactly where it is
async function replacePlanPdf(d,file){
  const boot=document.getElementById('boot');boot.style.display='grid';
  let pdf,preview,vp1,numPages;
  try{
    const buf=await file.arrayBuffer();
    pdf=await pdfjsLib.getDocument({data:buf}).promise;numPages=pdf.numPages;
    const page=await pdf.getPage(1);vp1=page.getViewport({scale:1});preview=await renderPagePreview(page);
  }catch(e){boot.style.display='none';console.error(e);toast('Could not read that PDF');return;}
  boot.style.display='none';
  const nPins=drawReports(d.id).length;
  const body=document.createElement('div');
  body.innerHTML=`
    <div style="border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;background:var(--surface-2)">
      <img src="${preview.url}" alt="New plan preview" style="width:100%;display:block;max-height:240px;object-fit:contain"></div>
    <p style="color:var(--muted);font-size:14.5px;line-height:1.55;margin:0">
      This replaces the drawing for <b>${esc(d.name)}</b>. All ${nPins} pin${nPins!==1?'s':''} and their reports stay exactly where they are —
      use it to swap in a clean copy of the same drawing.${numPages>1?' Only page 1 of the new PDF is used.':''}</p>`;
  const foot=document.createElement('div');foot.style.display='flex';foot.style.gap='10px';foot.style.width='100%';
  const cancel=document.createElement('button');cancel.className='btn ghost block';cancel.textContent='Cancel';
  const ok=document.createElement('button');ok.className='btn primary block';ok.textContent='Replace';
  foot.append(cancel,ok);
  const ctl=sheetShell({title:'Replace PDF',bodyNode:body,footNode:foot,full:true});
  cancel.onclick=ctl.close;
  ok.onclick=async()=>{
    ok.disabled=true;cancel.disabled=true;ok.textContent='Saving…';

  };
}

/* ============================ estimates (takeoff) ============================
   A low-key estimating tool. Upload drawings, set a scale (tap two points + a length),
   then draw a duct run down its middle: the length is exact (you draw it) and the app
   reads out to the bold lines for the width, so it can give linear feet and area.
   The detected width shows as a shaded band you can confirm or override. */
const estDrawsOf=id=>S.estdraws.filter(d=>d.estId===id).sort((a,b)=>a.createdAt-b.createdAt);
const estRunsOf=drawId=>S.estruns.filter(r=>r.drawId===drawId).sort((a,b)=>a.createdAt-b.createdAt);
const estFind=id=>S.estimates.find(e=>e.id===id);
const estDrawFind=id=>S.estdraws.find(d=>d.id===id);
// duct types and their colors (medium-pressure supply orange, low-pressure supply yellow,
// return green, exhaust purple)
const DUCT_KINDS={mps:{label:'Med. supply',short:'MPS',color:'#ea580c'},
  lps:{label:'Low supply',short:'LPS',color:'#eab308'},
  ret:{label:'Return',short:'Return',color:'#16a34a'},
  exh:{label:'Exhaust',short:'Exhaust',color:'#7c3aed'}};
const estKindOf=r=>(DUCT_KINDS[r&&r.kind]||DUCT_KINDS.mps);
const LABELCODE={mps:'MPS',lps:'LPS',ret:'RET',exh:'EXH'};
const estIsFill=r=>!!(r&&r.widthMode==='fill');
const estIsMain=r=>!!(r&&(r.role?r.role==='main':(!estIsFill(r)&&!r.tieStart)));
const estGroupOf=r=>(r&&(r.groupId||r.id))||'';
function estRunMain(rs,gid){return rs.find(x=>x.id===gid)||rs.find(x=>estGroupOf(x)===gid&&estIsMain(x))||rs.find(x=>estGroupOf(x)===gid)||null;}
function estGroupLabel(rs,r){const m=estRunMain(rs,estGroupOf(r));return (m&&m.label)||(r&&r.label)||'';}
function estAutoLabel(rs,kind){const n=rs.filter(x=>estIsMain(x)&&(x.kind||'mps')===kind).length+1;return (LABELCODE[kind]||String(kind).toUpperCase())+' '+n;}
function estDefaultKind(){try{const k=localStorage.getItem('ductpro-est-kind');if(DUCT_KINDS[k])return k;}catch(e){}return 'mps';}
// estimating standards (shared): hours per lf/sf and one access door every N feet of run
function estSettings(){const d={hrPerLf:0,hrPerSf:0,lfPerDoor:0,hrPerBranch:0,fMps:0,fLps:0,fRet:0,fExh:0,wideIn:0,wideF:0,narrowIn:0,narrowF:0};const v=S.estsetArr&&S.estsetArr[0];if(v){['hrPerLf','hrPerSf','lfPerDoor','hrPerBranch','fMps','fLps','fRet','fExh','wideIn','wideF','narrowIn','narrowF'].forEach(k=>{if(typeof v[k]==='number')d[k]=v[k];});}return d;}
// labor factor for a piece of duct: duct-type factor × width rule(s) (blank = ×1 / off)
function estFactorFor(kind,widthIn,s){s=s||estSettings();let f=({mps:s.fMps,lps:s.fLps,ret:s.fRet,exh:s.fExh})[kind||'mps'];if(!(f>0))f=1;
  if(widthIn>0){if(s.wideIn>0&&s.wideF>0&&widthIn>s.wideIn)f*=s.wideF;if(s.narrowIn>0&&s.narrowF>0&&widthIn<s.narrowIn)f*=s.narrowF;}return f;}
// a run split into pieces with their own width: [{lf, sf, win (width in inches, nearest ½")}]
function estRunParts(r,d){const rIn=w=>Math.round(w*24)/2;
  if(r.widthMode==='fill')return [{lf:estRunLenFt(r,d),sf:estAreaFt(r,d),win:rIn(estFillWidthFt(r,d))}];
  if(estAreaEdited(r)){const m=estRunParts(Object.assign({},r,{areaPoly:null,areaPolys:null,areaFrac:0}),d),tot=m.reduce((t,p)=>t+p.sf,0),a=estAreaFt(r,d);
    return tot>0?m.map(p=>({lf:p.lf,sf:p.sf*a/tot,win:p.win})):[{lf:estLenFt(r.pts,d),sf:a,win:rIn(estWidthFt(r,d))}];}
  const sw=estSegW(r);if(sw){const L=estSegLensFt(r,d),k=(d.w||1)*estFpp(d);
    if(Array.isArray(r.wProf)&&r.wProf.length===sw.length)   // width profile: each size along a segment is its own piece (reducers)
      return [].concat(...r.wProf.map((o,i)=>{let pr=null;if(o&&Array.isArray(o.p)&&o.p.length>=2){pr=[];for(let j=0;j+1<o.p.length;j+=2)pr.push([o.p[j],o.p[j+1]]);}else if(Array.isArray(o)&&o.length)pr=o;
        return (pr&&pr.length?pr:[[1,sw[i]]]).map(q=>({lf:L[i]*q[0],sf:L[i]*q[0]*q[1]*k,win:rIn(q[1]*k)}));}));
    return sw.map((w,i)=>{const wf=w*k;return {lf:L[i],sf:L[i]*wf,win:rIn(wf)};});}
  return [{lf:estLenFt(r.pts,d),sf:estAreaFt(r,d),win:rIn(estWidthFt(r,d))}];}
// factor-weighted totals for an estimate: kL / kA = effective multipliers on lf and sf labor
function estFactored(estId){const s=estSettings();let L=0,fL=0,A=0,fA=0;
  estDrawsOf(estId).forEach(d=>estRunsOf(d.id).forEach(r=>estRunParts(r,d).forEach(p=>{const f=estFactorFor(r.kind,p.win,s);L+=p.lf;fL+=p.lf*f;A+=p.sf;fA+=p.sf*f;})));
  return {L,fL,A,fA,kL:L>0?fL/L:1,kA:A>0?fA/A:1};}
function estFactorsActive(s){s=s||estSettings();return ['fMps','fLps','fRet','fExh'].some(k=>s[k]>0&&s[k]!==1)||(s.wideIn>0&&s.wideF>0&&s.wideF!==1)||(s.narrowIn>0&&s.narrowF>0&&s.narrowF!==1);}
function estBranchCount(estId){let n=0;estDrawsOf(estId).forEach(d=>{estRunsOf(d.id).forEach(r=>{if(r.role==='branch'||(!r.role&&r.tieStart&&r.widthMode!=='fill'))n++;});});return n;}
function estStandardsSheet(){
  const cur=estSettings();const body=document.createElement('div');
  body.innerHTML=`<p class="cl-note">Rules of thumb used to turn measured duct into labor hours and access doors. They apply to every estimate.</p>
    <div class="field" style="margin-top:14px"><label>Hours per linear foot</label><input class="inp" id="sHl" inputmode="decimal" value="${cur.hrPerLf||''}" placeholder="e.g. 0.05"></div>
    <div class="field"><label>Hours per square foot</label><input class="inp" id="sHs" inputmode="decimal" value="${cur.hrPerSf||''}" placeholder="e.g. 0.02"></div>
    <div class="field"><label>Access door every ___ feet of run</label><input class="inp" id="sDd" inputmode="decimal" value="${cur.lfPerDoor||''}" placeholder="e.g. 20"></div>
    <div class="cl-subhead" style="margin-top:4px">Branch load — branches are slower to clean than a straight run</div>
    <div class="field" style="margin-top:8px"><label>Extra hours per branch</label><input class="inp" id="sHb" inputmode="decimal" value="${cur.hrPerBranch||''}" placeholder="e.g. 0.4"></div>
    <div class="cl-subhead" style="margin-top:4px">Labor factors — multiply hours by duct type and size (blank = ×1)</div>
    <div class="facgrid">${[['fMps','MPS'],['fLps','LPS'],['fRet','Return'],['fExh','Exhaust']].map(([k,l])=>`<div class="field"><label>${l} ×</label><input class="inp" id="s_${k}" inputmode="decimal" value="${cur[k]||''}" placeholder="1.00"></div>`).join('')}</div>
    <div class="facrow"><span>Wider than</span><input class="inp" id="s_wideIn" inputmode="decimal" value="${cur.wideIn||''}" placeholder="e.g. 24"><span>″ ×</span><input class="inp" id="s_wideF" inputmode="decimal" value="${cur.wideF||''}" placeholder="1.10"></div>
    <div class="facrow" style="margin-bottom:2px"><span>Narrower than</span><input class="inp" id="s_narrowIn" inputmode="decimal" value="${cur.narrowIn||''}" placeholder="e.g. 8"><span>″ ×</span><input class="inp" id="s_narrowF" inputmode="decimal" value="${cur.narrowF||''}" placeholder="1.15"></div>
    <p class="cl-note" style="font-size:12.5px;margin-top:6px">Width is each piece's measured duct width (rounded to ½″). Factors multiply both hrs by lf and hrs by sf; access doors use the raw footage.</p>`;
  const foot=document.createElement('button');foot.className='btn primary block';foot.textContent='Save standards';
  const ctl=sheetShell({title:'Estimating standards',bodyNode:body,footNode:foot});
  foot.onclick=async()=>{const num=id=>{const v=parseFloat(body.querySelector(id).value);return isNaN(v)||v<0?0:v;};
    const doc={id:'default',hrPerLf:num('#sHl'),hrPerSf:num('#sHs'),lfPerDoor:num('#sDd'),hrPerBranch:num('#sHb'),fMps:num('#s_fMps'),fLps:num('#s_fLps'),fRet:num('#s_fRet'),fExh:num('#s_fExh'),wideIn:num('#s_wideIn'),wideF:num('#s_wideF'),narrowIn:num('#s_narrowIn'),narrowF:num('#s_narrowF'),createdAt:now()};
    S.estsetArr=[doc];await pPut('estsettings',doc).catch(()=>toast('Not saved — check connection'));
    ctl.close();render();toast('Standards saved');};

// labor + access-door estimate from totals and the standards
function estDerived(totL,totA,branches,mode,kL,kA){const s=estSettings();branches=branches||0;mode=(mode==='none')?'none':'flat';kL=kL>0?kL:1;kA=kA>0?kA:1;
  const baseLf=totL*s.hrPerLf*kL, baseSf=totA*s.hrPerSf*kA;
  const flat=(mode==='flat')?branches*s.hrPerBranch:0;
  return {hrsLf:baseLf+flat, hrsSf:baseSf+flat, baseLf, baseSf, doors:s.lfPerDoor>0?Math.ceil(totL/s.lfPerDoor):0,
    branches, branchMode:mode, branchFlat:flat,
    hasBranchRate:(mode==='flat'&&s.hrPerBranch>0),
    hasLf:s.hrPerLf>0, hasSf:s.hrPerSf>0, hasDoor:s.lfPerDoor>0,

// total area of a drawing's runs as a UNION (rasterized), so tie-ins/overlaps are not double counted

// parse a length like 20, 20.5, 20', 20' 6", 18in, 6" into feet
function parseFeet(s){ s=String(s||'').trim().toLowerCase().replace(/[’']/g,"'").replace(/[”"]/g,'"');
  let m=s.match(/^(\d+(?:\.\d+)?)\s*'\s*(\d+(?:\.\d+)?)?\s*"?$/); if(m)return (+m[1])+(m[2]?(+m[2])/12:0);
  m=s.match(/^(\d+(?:\.\d+)?)\s*(?:ft|feet|f)?$/); if(m&&/ft|feet|f|^\d/.test(s))return +m[1];
  m=s.match(/^(\d+(?:\.\d+)?)\s*(?:in|inch|inches|")$/); if(m)return (+m[1])/12;
  const n=parseFloat(s); return isNaN(n)?null:n; }

  function up(ev){if(mode==='filledit'){editPainting=false;return;}if(!ptrs.has(ev.pointerId))return;const was1=ptrs.size===1;ptrs.delete(ev.pointerId);
    if(ptrs.size<2)pinch=null;if(ptrs.size===0){if(was1&&moved<6){if(mode==='fill'){if(fillStep==='trace')fillAddPoint(ev.clientX,ev.clientY);else doFill(ev.clientX,ev.clientY);}else if(mode!=='view')addPoint(ev.clientX,ev.clientY);else{const id=runAt(ev.clientX,ev.clientY);if(id)runSheet(id);}}panStart=null;}}
  viewer.addEventListener('pointerup',up);viewer.addEventListener('pointercancel',up);
  // mouse-wheel / trackpad zoom around the cursor
  viewer.addEventListener('wheel',ev=>{ev.preventDefault();const r=viewer.getBoundingClientRect();
    const cx=ev.clientX-r.left,cy=ev.clientY-r.top;const f=Math.exp(-ev.deltaY*0.0015);
    const ns=Math.max(0.2,Math.min(16,scale*f));const ax=(cx-tx)/scale,ay=(cy-ty)/scale;
    scale=ns;tx=cx-ax*scale;ty=cy-ay*scale;apply();},{passive:false});

  requestAnimationFrame(()=>{fit();refresh();
    estImage(d).then(img=>{if(img&&img.url&&S.estDrawId===d.id){const pl=app.querySelector('#eplan');if(pl&&pl.isConnected)pl.src=img.url;}}).catch(()=>{});
    loadPdfE().then(pg=>{if(pg)renderHiresE();}).catch(()=>{});
    setTimeout(healRuns,600);});
  // runs saved without their measured width (e.g. the save after measuring failed): measure them again now
  async function healRuns(){const todo=estRunsOf(d.id).filter(r=>r.widthMode==='auto'&&r.pts&&r.pts.length>=4&&!estSegW(r)&&!estHasEdges(r)&&!(r.widthFrac>0));
    if(!todo.length||!d.cal)return;
    for(const r of todo){if(!viewer.isConnected)return;if(!S.estruns.includes(r)||estSegW(r))continue;
      hint.innerHTML=`${I.info}<span>Reading width…</span>`;
      try{const m=await estMeasureRun(d,r.pts,true);if(!m||!S.estruns.includes(r))continue;
        {const keep=r.tieStart?r.pts.slice(0,2):null;r.pts=m.pts;if(keep){r.pts[0]=keep[0];r.pts[1]=keep[1];}}
        r.segW=m.segW;r.wProf=m.wProf;r.edgeL=m.edgeL;r.edgeR=m.edgeR;pPut('estruns',r).catch(()=>toast('Not saved — check connection'));
        if(viewer.isConnected)refresh();}catch(e){console.warn('re-measure',e);}}
    if(viewer.isConnected){renderBar();toast('Re-measured '+todo.length+' run'+(todo.length>1?'s':''));}}
}

async function exportInteractivePdf(j,btn,status,mode,planIds,mkTypes){
  mkTypes=mkTypes||{exhaust:true,access:true,note:true,draw:true};
  if(!window.PDFLib){toast('PDF engine still loading — try again');return;}
  const content=mode==='markups'?{reports:false,markups:true}
    :mode==='both'?{reports:true,markups:true}:{reports:true,markups:false};
  const dlLabel=I.download+' Download PDF';
  btn.disabled=true;const reset=()=>{btn.disabled=false;btn.innerHTML=dlLabel;};
  const set=t=>{btn.textContent=t;if(status)status.textContent=t;};
  set('Loading plans…');
  try{
    let draws=jobDrawings(j.id);
    if(planIds&&planIds.length)draws=draws.filter(d=>planIds.includes(d.id));
    if(!draws.length){toast('Add a plan first');reset();return;}
    // photos only needed for report pages
    let photoBytes={};
    if(content.reports){try{(await photosByJob(j.id)).forEach(p=>{try{photoBytes[p.id]=dataUrlToBytes(p.data);}catch(e){}});}catch(e){console.warn(e);}}
    // markups: freehand strokes (loaded on demand) + tags (already in state), grouped by plan
    let strokesByDrawId={};
    if(content.markups&&mkTypes.draw){try{(await strokesByJob(j.id)).forEach(st=>{(strokesByDrawId[st.drawId]=strokesByDrawId[st.drawId]||[]).push(st);});
      Object.values(strokesByDrawId).forEach(a=>a.sort((x,y)=>x.createdAt-y.createdAt));}catch(e){console.warn(e);}}
    let logoPng=null;try{logoPng=await fetchBytes('logo.png');}catch(e){}
    const plans=[];
    for(let di=0;di<draws.length;di++){
      const d=draws[di];set(`Loading plan ${di+1}/${draws.length}…`);
      let pdfBytes=null;
      if(d.pdfChunks||d.pdfKey){try{pdfBytes=await loadDrawingPdfBytes(d);}catch(e){console.warn(e);}}
      const reports=content.reports?drawReports(d.id).map(r=>({
        num:r.num,type:r.type,typeOther:r.typeOther,status:r.status,revisit:r.revisit,
        equipment:r.equipment,area:r.area,nx:r.nx,ny:r.ny,
        before:(r.before||[]).map(id=>photoBytes[id]).filter(Boolean),
        after:(r.after||[]).map(id=>photoBytes[id]).filter(Boolean),
      })):[];
      const markers=content.markups?drawMarkers(d.id).filter(m=>mkTypes[m.kind]).sort(byNumThenAge):[];
      const strokes=(content.markups&&mkTypes.draw)?(strokesByDrawId[d.id]||[]):[];
      plans.push({name:d.name,pdfBytes,pageIndex:d.pageIndex||0,imgBytes:pdfBytes?null:dataUrlToBytes(d.img),pw:d.w,ph:d.h,reports,markers,strokes});
    }
    set('Building PDF…');
    const bytes=await makeExportPdf(PDFLib,{job:j,company:COMPANY,plans,logoPng,content});
    const tag=mode==='markups'?' markups':mode==='both'?' full':'';
    const fname=(j.name+' '+j.number).replace(/[^\w .\-]+/g,'').trim()+tag+' — Arctic.pdf';
    set('');reset();
    const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    const a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),15000);
    toast('PDF downloaded');
  }catch(e){
    console.error(e);set('');reset();toast('Export failed — try again');
  }
}

// ---- markup rendering helpers for export (standalone copies of the viewer's path math) ----
const _ef1=n=>Math.round(n*10)/10;
function _expLinePath(P){
  if(P.length===1)return `M${_ef1(P[0][0])},${_ef1(P[0][1])}l0.01,0`;
  let s=`M${_ef1(P[0][0])},${_ef1(P[0][1])}`;
  for(let i=1;i<P.length-1;i++){const mx=(P[i][0]+P[i+1][0])/2,my=(P[i][1]+P[i+1][1])/2;s+=`Q${_ef1(P[i][0])},${_ef1(P[i][1])} ${_ef1(mx)},${_ef1(my)}`;}
  const L=P[P.length-1];return s+`L${_ef1(L[0])},${_ef1(L[1])}`;
}
function _expOutlinePath(P,w){
  const n=P.length,W=P.map(p=>w*(0.45+1.1*(p[2]==null?0.5:p[2])));
  for(let k=0;k<2;k++)for(let i=1;i<n-1;i++)W[i]=(W[i-1]+W[i]*2+W[i+1])/4;
  if(n===1){const r=W[0]/2,x=P[0][0],y=P[0][1];
    return `M${_ef1(x-r)},${_ef1(y)}a${_ef1(r)},${_ef1(r)} 0 1,0 ${_ef1(2*r)},0a${_ef1(r)},${_ef1(r)} 0 1,0 ${_ef1(-2*r)},0Z`;}
  const Lp=[],Rp=[];
  for(let i=0;i<n;i++){const a=P[Math.max(0,i-1)],b=P[Math.min(n-1,i+1)];
    let dx=b[0]-a[0],dy=b[1]-a[1];const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;
    const r=W[i]/2;Lp.push([P[i][0]-dy*r,P[i][1]+dx*r]);Rp.push([P[i][0]+dy*r,P[i][1]-dx*r]);}
  const sm=Q=>{let s='';for(let i=1;i<Q.length-1;i++){const mx=(Q[i][0]+Q[i+1][0])/2,my=(Q[i][1]+Q[i+1][1])/2;
    s+=`Q${_ef1(Q[i][0])},${_ef1(Q[i][1])} ${_ef1(mx)},${_ef1(my)}`;}const Z=Q[Q.length-1];return s+`L${_ef1(Z[0])},${_ef1(Z[1])}`;};
  const Rr=Rp.slice().reverse(),re=W[n-1]/2,rs=W[0]/2;
  return `M${_ef1(Lp[0][0])},${_ef1(Lp[0][1])}`+sm(Lp)+`A${_ef1(re)},${_ef1(re)} 0 0,0 ${_ef1(Rr[0][0])},${_ef1(Rr[0][1])}`
    +sm(Rr)+`A${_ef1(rs)},${_ef1(rs)} 0 0,0 ${_ef1(Lp[0][0])},${_ef1(Lp[0][1])}Z`;
}
// stroke -> {path, w(in svg units), hl} for a page pw x ph (scale pw/1000 maps it onto the page)
function strokeExportPath(st,pw,ph){
  const a=ph/pw,P=[];
  for(let i=0;i<(st.pts||[]).length;i+=3)P.push([st.pts[i]*1000,st.pts[i+1]*1000*a,st.pts[i+2]]);
  if(!P.length)return null;
  const w=(st.w||0.004)*1000;
  return st.tool==='hl'?{path:_expLinePath(P),w,hl:true}:{path:_expOutlinePath(P,w),w,hl:false};
}
const MK_LETTER={exhaust:'E',access:'A',note:'N'};
function mkExportLabel(m){
  if(m.kind==='note'){const t=String(m.note||'').replace(/\s+/g,' ').trim();return t.length>44?t.slice(0,43)+'…':t;}
  const sz=normDoor(m.doorSize),q=Math.max(1,+m.doorQty||1);return sz?sz+(q>1?' \u00d7'+q:''):'';
}
// ---- interactive-PDF builder (validated against real E-size sheets) ----
async function makeExportPdf(PDFLib,{job,company,plans,logoPng,content}){
  content=content||{reports:true,markups:false};
  const {PDFDocument, rgb, StandardFonts, PDFName, LineCapStyle, BlendMode}=PDFLib;
  const out=await PDFDocument.create();
  const helv=await out.embedFont(StandardFonts.Helvetica);
  const helvB=await out.embedFont(StandardFonts.HelveticaBold);
  let logo=null; try{ if(logoPng) logo=await out.embedPng(logoPng); }catch(e){}
  const GREEN=rgb(0.08,0.60,0.42), AMBER=rgb(0.77,0.49,0.08), INK=rgb(0.1,0.12,0.14), MUT=rgb(0.45,0.5,0.55), WHITE=rgb(1,1,1);
  const MK_COL={exhaust:rgb(0.486,0.227,0.914),access:rgb(0.031,0.569,0.698),note:rgb(0.859,0.153,0.467)};
  const hexRgb=h=>{h=String(h||'').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
    const n=parseInt(h,16);return isNaN(n)?rgb(0.1,0.1,0.1):rgb(((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255);};
  const wrap=(txt,font,size,maxw)=>{const words=String(txt||'').split(/\s+/);const lines=[];let ln='';
    for(const w of words){const t=ln?ln+' '+w:w;if(font.widthOfTextAtSize(t,size)>maxw&&ln){lines.push(ln);ln=w;}else ln=t;}
    if(ln)lines.push(ln);return lines;};
  function drawReportPage(pg,r,plan){
    const W=pg.getWidth(),H=pg.getHeight(),M=48; let y=H-M;
    if(logo){const lw=96,lh=lw*(logo.height/logo.width);pg.drawImage(logo,{x:M,y:y-lh+6,width:lw,height:lh});}
    else{pg.drawText(company||'Arctic',{x:M,y:y-6,size:20,font:helvB,color:INK});}
    pg.drawText('Duct Post Inspection',{x:W-M-helv.widthOfTextAtSize('Duct Post Inspection',11),y:y-2,size:11,font:helv,color:MUT});
    const idn='#'+r.num; pg.drawText(idn,{x:W-M-helvB.widthOfTextAtSize(idn,22),y:y-26,size:22,font:helvB,color:INK});
    y-=44;
    const sub=(job.name||'')+'  \u00b7  '+(job.number||'')+(job.address?('  \u00b7  '+job.address.replace(/\n/g,', ')):'');
    pg.drawText(sub,{x:M,y,size:9.5,font:helv,color:MUT}); y-=16;
    pg.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:2,color:rgb(0.12,0.5,0.85)}); y-=24;
    const row=(k,v,vcol)=>{const lines=wrap(v,helvB,11,W-M-150);pg.drawText(k,{x:M,y,size:10,font:helv,color:MUT});
      lines.forEach((ln,i)=>pg.drawText(ln,{x:M+100,y:y-i*14,size:11,font:helvB,color:vcol||INK}));y-=Math.max(20,14*lines.length+6);};
    row('Type', r.type==='Other'?(r.typeOther||'Other'):(r.type||'\u2014'));
    row('Status', r.status, r.status==='Completed'?GREEN:AMBER);
    row('Plan', plan.name);
    if(r.revisit) row('Re-visit', r.revisit);
    const eq=(r.equipment||[]).filter(e=>e.item||e.notes);
    if(eq.length){y-=6;pg.drawText('SERVICED EQUIPMENT',{x:M,y,size:10,font:helvB,color:INK});y-=16;
      eq.forEach(e=>{pg.drawText(e.item||'\u2014',{x:M,y,size:10.5,font:helvB,color:INK});
        const nl=wrap(e.notes||'',helv,10,W-M*2-12);nl.forEach((ln,i)=>pg.drawText(ln,{x:M+12,y:y-14-i*13,size:10,font:helv,color:MUT}));
        y-=16+nl.length*13+6;});}
    if(r.area){y-=4;pg.drawText('INSPECTED AREA',{x:M,y,size:10,font:helvB,color:INK});y-=15;
      wrap(r.area,helv,10.5,W-M*2).forEach(ln=>{pg.drawText(ln,{x:M,y,size:10.5,font:helv,color:INK});y-=14;});}
    const strip=(label,imgs)=>{if(!imgs||!imgs.length)return;y-=10;
      pg.drawText(label,{x:M,y,size:10,font:helvB,color:INK});y-=6;
      const gap=8,cols=3,cw=(W-M*2-gap*(cols-1))/cols,chh=cw*0.75;let x=M,placed=0;
      for(const im of imgs){if(placed&&placed%cols===0){x=M;y-=chh+gap;}try{pg.drawImage(im,{x,y:y-chh,width:cw,height:chh});}catch(e){}x+=cw+gap;placed++;}
      y-=chh+gap;};
    strip('BEFORE', r.beforeImg); strip('AFTER', r.afterImg);
  }
  // draw the markup layer (freehand strokes + tags) onto a plan page
  function drawMarkups(pg,plan){
    const pw=pg.getWidth(), ph=pg.getHeight(), S=pw/1000;
    for(const st of (plan.strokes||[])){
      let g;try{g=strokeExportPath(st,pw,ph);}catch(e){continue;}
      if(!g)continue;
      try{
        if(g.hl)pg.drawSvgPath(g.path,{x:0,y:ph,scale:S,borderColor:hexRgb(st.color),borderWidth:g.w,
          borderOpacity:0.4,borderLineCap:LineCapStyle.Round,blendMode:BlendMode.Multiply});
        else pg.drawSvgPath(g.path,{x:0,y:ph,scale:S,color:hexRgb(st.color)});
      }catch(e){}
    }
    for(const m of (plan.markers||[])){
      const x=m.nx*pw, y=(1-m.ny)*ph, R=Math.max(9,pw*0.0082);
      const col=MK_COL[m.kind]||MK_COL.note;
      pg.drawCircle({x,y,size:R,color:col,opacity:0.45,borderColor:col,borderWidth:Math.max(1.3,R*0.2),borderOpacity:1});
      const letter=MK_LETTER[m.kind]||'?', fs=R*1.02, tw=helvB.widthOfTextAtSize(letter,fs);
      pg.drawText(letter,{x:x-tw/2,y:y-fs*0.35,size:fs,font:helvB,color:WHITE});
      const label=mkExportLabel(m);
      if(label){const ls=Math.max(8,R*0.9),lw=helvB.widthOfTextAtSize(label,ls),padx=4,lx=x+R+5;
        pg.drawRectangle({x:lx-padx,y:y-ls*0.75,width:lw+padx*2,height:ls*1.65,color:WHITE,opacity:0.82,
          borderColor:col,borderWidth:0.7,borderOpacity:0.55});
        pg.drawText(label,{x:lx,y:y-ls*0.32,size:ls,font:helvB,color:col});}
    }
  }
  async function embedJpgs(list){const a=[];for(const bz of (list||[])){try{a.push(await out.embedJpg(bz));}catch(e){}}return a;}
  for(const plan of plans){
    let pg;
    if(plan.pdfBytes){const src=await PDFDocument.load(plan.pdfBytes);const pi=Math.min(plan.pageIndex||0,src.getPageCount()-1);[pg]=await out.copyPages(src,[pi]);out.addPage(pg);}
    else{let img=null;try{img=await out.embedJpg(plan.imgBytes);}catch(e){}const w=(img?img.width:plan.pw)||1200,h=(img?img.height:plan.ph)||1600;pg=out.addPage([w,h]);if(img)pg.drawImage(img,{x:0,y:0,width:w,height:h});}
    const pw=pg.getWidth(), ph=pg.getHeight();
    // strip the source plan's own annotations (e.g. old Bluebeam markups) for a clean export
    pg.node.set(PDFName.of('Annots'), out.context.obj([]));
    // markups sit under the numbered report pins
    if(content.markups)drawMarkups(pg,plan);
    if(content.reports){
      const repPages=[];
      for(const r of plan.reports){r.beforeImg=await embedJpgs(r.before);r.afterImg=await embedJpgs(r.after);
        const rp=out.addPage([612,792]);drawReportPage(rp,r,plan);repPages.push(rp);}
      const annots=[];
      plan.reports.forEach((r,i)=>{
        const x=r.nx*pw, y=(1-r.ny)*ph, R=Math.max(10,pw*0.0085);
        const col=r.status==='Completed'?GREEN:AMBER;
        pg.drawCircle({x,y,size:R,color:col,opacity:0.42,borderColor:col,borderWidth:Math.max(1.4,R*0.2),borderOpacity:1});
        const fs=R*1.0, tw=helvB.widthOfTextAtSize(String(r.num),fs);
        pg.drawText(String(r.num),{x:x-tw/2,y:y-fs*0.35,size:fs,font:helvB,color:rgb(1,1,1)});
        const LR=R*2;
        const ctx=out.context, dest=ctx.obj([repPages[i].ref, PDFName.of('Fit')]);
        const annot=ctx.obj({Type:PDFName.of('Annot'),Subtype:PDFName.of('Link'),Rect:[x-LR,y-LR,x+LR,y+LR],
          Border:[0,0,0],A:{Type:PDFName.of('Action'),S:PDFName.of('GoTo'),D:dest}});
        annots.push(ctx.register(annot));
      });
      pg.node.set(PDFName.of('Annots'), out.context.obj(annots));
    }
  }
  return await out.save();
}

/* ============================ theme ============================ */
function cycleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?'':'dark';
  if(next)document.documentElement.setAttribute('data-theme',next);else document.documentElement.removeAttribute('data-theme');
  try{localStorage.setItem('ductpro-theme',next);}catch(e){}
  toast(next?next[0].toUpperCase()+next.slice(1)+' theme':'System theme');
}
(function initTheme(){try{const t=localStorage.getItem('ductpro-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();

/* ============================ boot ============================ */
function bootError(msg){
  const el=document.getElementById('boot');
  el.style.display='grid';
  el.innerHTML='<div style="max-width:30ch;text-align:center;color:var(--muted);padding:24px">'+
    '<div style="color:var(--danger);font-weight:700;font-size:17px;margin-bottom:8px">Couldn’t connect</div>'+
    '<div style="font-size:14px;line-height:1.5">'+esc(msg)+'</div></div>';
}
// what the app loads at startup: [state key, Firestore collection]
const BOOT_STORES=[['jobs','jobs'],['drawings','drawings'],['reports','reports'],['markers','markers'],
  ['users','users'],['groups','mkgroups'],['checklist','checklist'],
  ['estimates','estimates'],['estdraws','estdrawings'],['estruns','estruns'],['estsetArr','estsettings']];
// all collections at once. source 'cache' = what this phone already saved (instant, works with no signal)
async function loadStores(source){
  const out={};
  await Promise.all(BOOT_STORES.map(async([k,coll])=>{
    try{const snap=await fdb.collection(coll).get(source?{source}:undefined);out[k]=snap.docs.map(x=>x.data());}
    catch(e){if(k==='jobs'||k==='drawings'||k==='reports')throw e;console.warn(coll+' load failed',e);out[k]=null;}
  }));
  return out;
}
function applyStores(d){for(const k in d)if(d[k])S[k]=d[k];}
// who is using this device (asked once, by name)
function restoreUser(){
  try{const sv=JSON.parse(localStorage.getItem('ductpro-user')||'null');
    if(sv&&sv.id){let u=S.users.find(x=>x.id===sv.id);
      if(!u&&sv.first){u={id:sv.id,first:sv.first,last:sv.last||'',createdAt:sv.createdAt||now()};S.users.push(u);pPut('users',u).catch(()=>{});}
      S.user=u||null;}}catch(e){}
}
// fresh data arrived after the app was already showing: redraw without yanking anything out from under you
function refreshAfterSync(){
  const route=S.route[S.route.length-1];
  if(document.querySelector('#sheets .scrim'))return;            // a form is open; the next screen picks it up
  if(route==='drawing'){if(VW&&VW.renderPins){VW.renderPins();VW.renderMarkers();}return;}
  if(route==='export')return;
  render();
}
// Home Screen apps can hang on to an old copy of the page. If the server has a newer build, load it
// (right away at startup, otherwise the next time you're back on the home screen).
let UPDATE_READY=false;
function checkForUpdate(){
  if(BUILD.indexOf('__')===0||!window.fetch)return;
  const t0=Date.now();
  fetch(location.pathname,{cache:'reload'}).then(r=>r.ok?r.text():'').then(t=>{
    const m=t.match(/const BUILD='([^']+)'/);if(!m||m[1]===BUILD)return;
    let tried=null;try{tried=sessionStorage.getItem('ductpro-update');}catch(e){}
    if(tried===m[1])return;                                    // already reloaded for this build once; don't loop
    try{sessionStorage.setItem('ductpro-update',m[1]);}catch(e){}
    const route=S.route[S.route.length-1];
    if(Date.now()-t0<8000&&!document.querySelector('#sheets .scrim')&&(route==='jobs'||document.getElementById('boot').style.display!=='none'))location.reload();
    else UPDATE_READY=true;
  }).catch(()=>{});
}
(async function boot(){
  checkForUpdate();
  try{ await initStore(); }
  catch(e){ console.error(e); bootError('Could not reach Firebase. Check your internet connection and reload.'); return; }
  let shown=false;
  const show=()=>{restoreUser();restoreNav();render();watchChecklist();initBackButton();document.getElementById('boot').style.display='none';shown=true;};
  // 1) open with what this phone already has: no waiting on a weak signal
  try{const c=await loadStores('cache');
    if(c.jobs&&(c.jobs.length||(c.checklist&&c.checklist.length))){applyStores(c);show();}}catch(e){}
  // 2) then the latest from the server
  try{const f=await loadStores();applyStores(f);
    if(!shown)show();else{restoreUser();refreshAfterSync();}}
  catch(e){
    console.error(e);
    if(!shown)bootError('Connected to Firebase, but reads were denied. Make sure Firestore and Storage security rules allow access, then reload.');
  }
})();
</script>
