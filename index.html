  // ---------- placing reports / markers ----------
  function placeAt(cx,cy){
    const {nx,ny}=toNorm(cx,cy);
    if(nx<0||nx>1||ny<0||ny>1){toast('Tap on the plan');return;}
    if(placeKind==='report'){setMode('view');newReport(d,nx,ny);return;}
    const kind=placeKind, g=S.user?activeGroup():null;
    const num=jobMarkers(d.jobId).filter(m=>m.kind===kind).reduce((a,m)=>Math.max(a,m.num||0),0)+1;
    const m={id:uid(),jobId:d.jobId,drawId:d.id,kind,num,nx:+nx.toFixed(5),ny:+ny.toFixed(5),
      note:'',doorSize:'',doorQty:1,by:S.user?S.user.id:null,group:g?g.id:null,createdAt:now()};
    S.markers.push(m);
    if(g&&!groupVisible(g.id)){setGroupsHidden([g.id],false);refreshLayers();}else VW.renderMarkers();
    pPut('markers',m).catch(e=>{console.error(e);toast('Save failed — check connection');});
    markerSheet(m,{isNew:true,onChange:()=>{if(VW&&VW.renderMarkers)VW.renderMarkers();}});
  }

  // ---------- freehand ink ----------
  const PEN_COLORS=['#e11d48','#2563eb','#111827','#16a34a','#f97316','#7c3aed'];
  const HL_COLORS=['#facc15','#4ade80','#38bdf8','#f472b6','#fb923c'];
  const curColor=()=>tool==='hl'?hlColor:penColor;
  const f1=n=>Math.round(n*10)/10;
  function svgPts(s){const a=VW.baseH/VW.baseW,out=[];
    for(let i=0;i<s.pts.length;i+=3)out.push([s.pts[i]*1000,s.pts[i+1]*1000*a,s.pts[i+2]]);return out;}
  function linePath(P){
    if(P.length===1)return `M${f1(P[0][0])},${f1(P[0][1])}l0.01,0`;
    let s=`M${f1(P[0][0])},${f1(P[0][1])}`;
    for(let i=1;i<P.length-1;i++){const mx=(P[i][0]+P[i+1][0])/2,my=(P[i][1]+P[i+1][1])/2;s+=`Q${f1(P[i][0])},${f1(P[i][1])} ${f1(mx)},${f1(my)}`;}
    const L=P[P.length-1];return s+`L${f1(L[0])},${f1(L[1])}`;
  }
  // pressure-sensitive pen: a filled outline whose width follows the Pencil's pressure
  function outlinePath(P,w){
    const n=P.length,W=P.map(p=>w*(0.45+1.1*(p[2]==null?0.5:p[2])));
    for(let k=0;k<2;k++)for(let i=1;i<n-1;i++)W[i]=(W[i-1]+W[i]*2+W[i+1])/4;
    if(n===1){const r=W[0]/2,x=P[0][0],y=P[0][1];
      return `M${f1(x-r)},${f1(y)}a${f1(r)},${f1(r)} 0 1,0 ${f1(2*r)},0a${f1(r)},${f1(r)} 0 1,0 ${f1(-2*r)},0Z`;}
    const Lp=[],Rp=[];
    for(let i=0;i<n;i++){
      const a=P[Math.max(0,i-1)],b=P[Math.min(n-1,i+1)];
      let dx=b[0]-a[0],dy=b[1]-a[1];const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;
      const r=W[i]/2;Lp.push([P[i][0]-dy*r,P[i][1]+dx*r]);Rp.push([P[i][0]+dy*r,P[i][1]-dx*r]);
    }
    const sm=Q=>{let s='';for(let i=1;i<Q.length-1;i++){const mx=(Q[i][0]+Q[i+1][0])/2,my=(Q[i][1]+Q[i+1][1])/2;
      s+=`Q${f1(Q[i][0])},${f1(Q[i][1])} ${f1(mx)},${f1(my)}`;}const Z=Q[Q.length-1];return s+`L${f1(Z[0])},${f1(Z[1])}`;};
    const Rr=Rp.slice().reverse(),re=W[n-1]/2,rs=W[0]/2;
    return `M${f1(Lp[0][0])},${f1(Lp[0][1])}`+sm(Lp)+`A${f1(re)},${f1(re)} 0 0,0 ${f1(Rr[0][0])},${f1(Rr[0][1])}`
      +sm(Rr)+`A${f1(rs)},${f1(rs)} 0 0,0 ${f1(Lp[0][0])},${f1(Lp[0][1])}Z`;
  }
  const strokeD=s=>s.tool==='hl'?linePath(svgPts(s)):outlinePath(svgPts(s),s.w*1000);
  function strokeEl(s,override){
    const col=override||s.color;
    const el=document.createElementNS('http://www.w3.org/2000/svg','path');
    el.setAttribute('d',strokeD(s));
    if(s.tool==='hl'){el.setAttribute('fill','none');el.setAttribute('stroke',col);el.setAttribute('stroke-width',f1(s.w*1000));
      el.setAttribute('stroke-linecap','round');el.setAttribute('stroke-linejoin','round');el.setAttribute('opacity','.38');
      el.style.mixBlendMode='multiply';}
    else el.setAttribute('fill',col);
    return el;
  }
  // rebuild the ink layer: only showing groups, in per-set colors when more than one set shows
  function renderInk(){
    strokeEls.forEach(el=>el.remove());strokeEls.clear();
    const multi=layerColorMode();inkMulti=!!multi;
    STROKES.forEach(s=>{if(!strokeVisible(s))return;const el=strokeEl(s,multi?setColor(mkGroupOf(s)):null);strokeEls.set(s.id,el);ink.appendChild(el);});
    if(selCount())markSelected();
    if(selRectEl)ink.appendChild(selRectEl);
  }
  function refreshLayers(){renderInk();VW.renderMarkers();}
  VW.refreshLayers=refreshLayers;
  function addStroke(s,quiet){
    STROKES.push(s);if(quiet)return;
    if(!!layerColorMode()!==inkMulti){refreshLayers();return;}
    if(strokeVisible(s)){const el=strokeEl(s,inkMulti?setColor(mkGroupOf(s)):null);strokeEls.set(s.id,el);ink.appendChild(el);}
    if(inkMulti)renderLegend();
  }
  function removeStroke(id){
    STROKES=STROKES.filter(x=>x.id!==id);const el=strokeEls.get(id);if(el)el.remove();strokeEls.delete(id);
    if(!!layerColorMode()!==inkMulti)refreshLayers();else if(inkMulti)renderLegend();
  }
  function refreshUndo(){const b=vbar.querySelector('#dUndo');if(b){b.disabled=!undoStack.length;b.style.opacity=undoStack.length?'':'.35';}}

  function addPoint(e){
    if(cur.last){const dx=e.clientX-cur.last.x,dy=e.clientY-cur.last.y;if(dx*dx+dy*dy<2.25)return;} // skip <1.5px jitter
    const {nx,ny}=toNorm(e.clientX,e.clientY);
    const p=cur.isPen?Math.max(0.05,Math.min(1,e.pressure||0.5)):0.5;
    cur.pts.push(+nx.toFixed(5),+ny.toFixed(5),+p.toFixed(2));cur.last={x:e.clientX,y:e.clientY};
  }
  function beginStroke(e){
    closePalette();
    if(tool==='lasso'){lassoBegin(e);return;}
    if(tool==='erase'){cur={erase:true,last:{x:e.clientX,y:e.clientY}};eraseAt(e.clientX,e.clientY);return;}
    const w=(tool==='hl'?hlW:penW)/(VW.scale*VW.baseW);           // width relative to the page
    cur={tool,color:curColor(),w,pts:[],last:null,isPen:e.pointerType==='pen'};
    addPoint(e);
    cur.el=strokeEl(cur,inkMulti&&S.user?activeGroup().color:null);ink.appendChild(cur.el);
  }
  function extendStroke(e){
    if(!cur)return;
    if(cur.lasso||cur.moveSel){lassoMove(e);return;}
    const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];const list=evs.length?evs:[e];
    if(cur.erase){list.forEach(ev=>eraseAt(ev.clientX,ev.clientY));cur.last={x:e.clientX,y:e.clientY};return;}
    list.forEach(addPoint);
    if(!rafPending){rafPending=true;requestAnimationFrame(()=>{rafPending=false;if(cur&&cur.el)cur.el.setAttribute('d',strokeD(cur));});}
  }
  function finishStroke(){
    if(cur&&(cur.lasso||cur.moveSel)){lassoEnd();return;}
    const c=cur;cur=null;drawPid=null;drawType=null;
    if(!c||c.erase||!c.pts.length){if(c&&c.el)c.el.remove();refreshUndo();return;}
    const s={id:uid(),jobId:d.jobId,drawId:d.id,tool:c.tool,color:c.color,w:+c.w.toFixed(6),pts:c.pts,
      by:S.user?S.user.id:null,group:S.user?activeGroup().id:null,createdAt:now()};
    c.el.remove();addStroke(s);undoStack.push({type:'add',s});refreshUndo();
    pPut('strokes',s).catch(e=>{console.error(e);toast('Drawing not saved — check connection');});
  }
  function cancelStroke(){
    if(cur&&cur.moveSel){sel.strokes.forEach(id=>{const el=strokeEls.get(id);if(el)el.removeAttribute('transform');});
      VW.renderMarkers();markSelected();drawSelBox();}
    if(cur&&cur.el)cur.el.remove();cur=null;drawPid=null;drawType=null;}
  function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;
    t=Math.max(0,Math.min(1,t));return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));}
  function eraseAt(cx,cy){
    const {nx,ny}=toNorm(cx,cy),a=VW.baseH/VW.baseW,X=nx*1000,Y=ny*1000*a;
    const tolBase=12*1000/(VW.scale*VW.baseW);                    // ~12 screen px
    for(const s of STROKES.slice().reverse()){
      if(!strokeVisible(s))continue;
      const P=svgPts(s),tol=tolBase+s.w*1000/2;let hit=false;
      for(let i=0;i<P.length&&!hit;i++){const q=P[Math.min(i+1,P.length-1)];if(segDist(X,Y,P[i][0],P[i][1],q[0],q[1])<tol)hit=true;}
      if(hit){removeStroke(s.id);undoStack.push({type:'erase',s});pDel('strokes',s.id).catch(()=>{});refreshUndo();}
    }
  }
  function undo(){
    const a=undoStack.pop();if(!a)return;
    if(a.type==='add'){removeStroke(a.s.id);pDel('strokes',a.s.id).catch(()=>{});}
    else if(a.type==='erase'){addStroke(a.s);pPut('strokes',a.s).catch(()=>{});}
    else if(a.type==='clear'){a.list.forEach(s=>{addStroke(s);pPut('strokes',s).catch(()=>{});});}
    else if(a.type==='move'){applyMove(a.sIds,a.mIds,-a.dxn,-a.dyn);if(selBox){computeSelBox();drawSelBox();}}
    else if(a.type==='delsel'){a.strokes.forEach(s=>{addStroke(s);pPut('strokes',s).catch(()=>{});});
      a.markers.forEach(m=>{S.markers.push(m);pPut('markers',m).catch(()=>{});});
      if(a.markers.length){[...new Set(a.markers.map(m=>m.kind))].forEach(k=>renumberMarkers(d.jobId,k));VW.renderMarkers();}}
    refreshUndo();
  }
  // ---------- lasso: select strokes/markers, drag to move, delete ----------
  const svgU=(cx,cy)=>{const {nx,ny}=toNorm(cx,cy);return [nx*1000,ny*1000*(VW.baseH/VW.baseW)];};
  const pxU=px=>px*1000/(VW.scale*VW.baseW);                     // screen px -> ink units
  const svgEl=(tag,attrs)=>{const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const k in attrs)el.setAttribute(k,attrs[k]);return el;};
  function pip(x,y,poly){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;}return inside;}
  const selCount=()=>sel.strokes.size+sel.markers.size;
  const markSelected=()=>{sel.strokes.forEach(id=>{const el=strokeEls.get(id);if(el)el.classList.add('sel');});
    sel.markers.forEach(id=>{const el=mklayer.querySelector(`[data-id="${id}"]`);if(el)el.classList.add('lifted');});};
  function clearSel(quiet){
    sel.strokes.forEach(id=>{const el=strokeEls.get(id);if(el){el.classList.remove('sel');el.removeAttribute('transform');}});
    sel.markers.forEach(id=>{const el=mklayer.querySelector(`[data-id="${id}"]`);if(el)el.classList.remove('lifted');});
    sel={strokes:new Set(),markers:new Set()};selBox=null;
    if(selRectEl){selRectEl.remove();selRectEl=null;}
    if(!quiet&&mode==='draw')renderBar();
  }
  function computeSelBox(){
    const a=VW.baseH/VW.baseW;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    sel.strokes.forEach(id=>{const s=STROKES.find(t=>t.id===id);if(!s)return;const hw=s.w*1000/2;
      for(let i=0;i<s.pts.length;i+=3){const X=s.pts[i]*1000,Y=s.pts[i+1]*1000*a;
        x0=Math.min(x0,X-hw);y0=Math.min(y0,Y-hw);x1=Math.max(x1,X+hw);y1=Math.max(y1,Y+hw);}});
    const mr=pxU(16);
    sel.markers.forEach(id=>{const m=S.markers.find(t=>t.id===id);if(!m)return;const X=m.nx*1000,Y=m.ny*1000*a;
      x0=Math.min(x0,X-mr);y0=Math.min(y0,Y-mr);x1=Math.max(x1,X+mr);y1=Math.max(y1,Y+mr);});
    if(x0>x1){selBox=null;return;}
    const pad=pxU(8);selBox={x0:x0-pad,y0:y0-pad,x1:x1+pad,y1:y1+pad};
  }
  function drawSelBox(dx=0,dy=0){
    if(!selBox){if(selRectEl){selRectEl.remove();selRectEl=null;}return;}
    if(!selRectEl)selRectEl=svgEl('rect',{class:'selbox','vector-effect':'non-scaling-stroke'});
    selRectEl.setAttribute('x',f1(selBox.x0+dx));selRectEl.setAttribute('y',f1(selBox.y0+dy));
    selRectEl.setAttribute('width',f1(selBox.x1-selBox.x0));selRectEl.setAttribute('height',f1(selBox.y1-selBox.y0));
    ink.appendChild(selRectEl);
  }
  function lassoBegin(e){
    const [X,Y]=svgU(e.clientX,e.clientY);
    if(selBox&&X>=selBox.x0&&X<=selBox.x1&&Y>=selBox.y0&&Y<=selBox.y1){   // drag the current selection
      cur={moveSel:true,sx:X,sy:Y,dx:0,dy:0,last:{x:e.clientX,y:e.clientY}};return;
    }
    clearSel(true);
    cur={lasso:true,poly:[[X,Y]],last:{x:e.clientX,y:e.clientY}};
    cur.el=svgEl('path',{class:'lasso','vector-effect':'non-scaling-stroke'});ink.appendChild(cur.el);
  }
  function lassoMove(e){
    const [X,Y]=svgU(e.clientX,e.clientY);cur.last={x:e.clientX,y:e.clientY};
    if(cur.moveSel){
      cur.dx=X-cur.sx;cur.dy=Y-cur.sy;const a=VW.baseH/VW.baseW;
      sel.strokes.forEach(id=>{const el=strokeEls.get(id);if(el)el.setAttribute('transform',`translate(${f1(cur.dx)} ${f1(cur.dy)})`);});
      sel.markers.forEach(id=>{const m=S.markers.find(t=>t.id===id),el=mklayer.querySelector(`[data-id="${id}"]`);
        if(m&&el){el.style.left=((m.nx+cur.dx/1000)*VW.baseW)+'px';el.style.top=((m.ny+cur.dy/1000/a)*VW.baseH)+'px';}});
      drawSelBox(cur.dx,cur.dy);return;
    }
    const P=cur.poly,L=P[P.length-1];if(Math.hypot(X-L[0],Y-L[1])<pxU(3))return;
    P.push([X,Y]);cur.el.setAttribute('d','M'+P.map(p=>f1(p[0])+','+f1(p[1])).join('L')+'Z');
  }
  function lassoEnd(){
    const c=cur;cur=null;drawPid=null;drawType=null;
    if(c.moveSel){
      if(Math.abs(c.dx)<pxU(2)&&Math.abs(c.dy)<pxU(2)){       // just a tap inside the selection
        sel.strokes.forEach(id=>{const el=strokeEls.get(id);if(el)el.removeAttribute('transform');});drawSelBox();return;}
      const a=VW.baseH/VW.baseW,dxn=c.dx/1000,dyn=c.dy/1000/a,sIds=[...sel.strokes],mIds=[...sel.markers];
      applyMove(sIds,mIds,dxn,dyn);undoStack.push({type:'move',sIds,mIds,dxn,dyn});refreshUndo();
      computeSelBox();drawSelBox();return;
    }
    if(c.el)c.el.remove();
    if(c.poly.length<3){renderBar();return;}                    // a tap outside: selection already cleared
    const poly=c.poly,a=VW.baseH/VW.baseW;
    STROKES.forEach(s=>{if(!strokeVisible(s))return;let n=0,t=0;for(let i=0;i<s.pts.length;i+=3){t++;if(pip(s.pts[i]*1000,s.pts[i+1]*1000*a,poly))n++;}
      if(t&&n/t>=0.5)sel.strokes.add(s.id);});
    tappableMarkers().forEach(m=>{if(pip(m.nx*1000,m.ny*1000*a,poly))sel.markers.add(m.id);});
    markSelected();computeSelBox();drawSelBox();renderBar();
    if(!selCount())toast('Nothing selected — circle the marks you want');
  }
  // shift strokes/markers by a normalized offset and save them
  function applyMove(sIds,mIds,dxn,dyn){
    sIds.forEach(id=>{const s=STROKES.find(t=>t.id===id);if(!s)return;
      for(let i=0;i<s.pts.length;i+=3){s.pts[i]=+(s.pts[i]+dxn).toFixed(5);s.pts[i+1]=+(s.pts[i+1]+dyn).toFixed(5);}
      const el=strokeEls.get(id);if(el){el.removeAttribute('transform');el.setAttribute('d',strokeD(s));}
      pPut('strokes',s).catch(()=>{});});
    mIds.forEach(id=>{const m=S.markers.find(t=>t.id===id);if(!m)return;
      m.nx=+Math.max(0,Math.min(1,m.nx+dxn)).toFixed(5);m.ny=+Math.max(0,Math.min(1,m.ny+dyn)).toFixed(5);
      pPut('markers',m).catch(()=>{});});
    if(mIds.length){VW.renderMarkers();markSelected();}
  }
  function deleteSelection(){
    const strokes=[...sel.strokes].map(id=>STROKES.find(t=>t.id===id)).filter(Boolean);
    const markers=[...sel.markers].map(id=>S.markers.find(t=>t.id===id)).filter(Boolean);
    const n=strokes.length+markers.length;if(!n)return;
    clearSel(true);
    strokes.forEach(s=>{removeStroke(s.id);pDel('strokes',s.id).catch(()=>{});});
    markers.forEach(m=>{S.markers=S.markers.filter(x=>x.id!==m.id);pDel('markers',m.id).catch(()=>{});});
    if(markers.length){[...new Set(markers.map(m=>m.kind))].forEach(k=>renumberMarkers(d.jobId,k));VW.renderMarkers();}
    undoStack.push({type:'delsel',strokes,markers});renderBar();
    toast('Deleted '+n+' item'+(n!==1?'s':'')+' — Undo to restore');
  }
  async function clearInk(){
    const list=mkHidden?[]:STROKES.filter(strokeVisible);
    if(!list.length){toast('No visible drawings on this plan');return;}
    if(!await confirmDialog({title:'Clear drawings?',message:'Removes the '+list.length+' visible drawn mark'+(list.length!==1?'s':'')+' on this plan. Markers stay.',confirmText:'Clear'}))return;
    clearSel(true);
    list.forEach(s=>{removeStroke(s.id);pDel('strokes',s.id).catch(()=>{});});
    undoStack.push({type:'clear',list});toast('Drawings cleared — Undo in Draw if needed');
  }
  async function loadInk(){
    try{const list=await strokesByDraw(d.id);if(!VW||!ink.isConnected)return;list.forEach(s=>addStroke(s,true));refreshLayers();}
    catch(e){console.warn('strokes load failed',e);}
  }
  function togglePalette(){
    if(paletteEl){closePalette();return;}
    const isHL=tool==='hl', cols=isHL?HL_COLORS:PEN_COLORS, sizes=isHL?[12,18,28]:[1.8,3,5.5], curW=isHL?hlW:penW;
    paletteEl=document.createElement('div');paletteEl.className='palette';
    paletteEl.innerHTML=cols.map(c=>`<button class="c ${c===(isHL?hlColor:penColor)?'on':''}" data-c="${c}" style="background:${c}" aria-label="Color"></button>`).join('')
      +'<span class="sep"></span>'
      +sizes.map(s=>{const px=Math.min(22,s*(isHL?0.85:2.6));return `<button class="wd ${s===curW?'on':''}" data-w="${s}" aria-label="Size"><i style="width:${px}px;height:${px}px"></i></button>`;}).join('')
      +(penSeen?`<span class="sep"></span><button class="btn ghost" data-finger style="min-height:34px;padding:0 10px;font-size:13px">Finger ${fingerDraws?'draws':'moves'}</button>`:'');
    document.body.appendChild(paletteEl);
    paletteEl.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{if(isHL)hlColor=b.dataset.c;else{penColor=b.dataset.c;if(tool==='erase')tool='pen';}saveInkPrefs();renderBar();});
    paletteEl.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{if(isHL)hlW=+b.dataset.w;else{penW=+b.dataset.w;if(tool==='erase')tool='pen';}saveInkPrefs();renderBar();});
    const fb=paletteEl.querySelector('[data-finger]');if(fb)fb.onclick=()=>{fingerDraws=!fingerDraws;renderBar();};
  }

  // ---------- pointer handling: draw / pan + pinch / tap / drag markers ----------
  const pts=new Map();let startDist=0,startScale=1,moved=0,panStart=null,downPt=null;
  const cancelLP=()=>{if(lp){clearTimeout(lp.timer);lp=null;}};
  const mkOpts=m=>({onChange:()=>{if(VW&&VW.renderMarkers)VW.renderMarkers();},onMove:()=>{relocM=m;setMode('move');}});
  function cancelDrag(){if(!dragM)return;dragM.m.nx=dragM.nx0;dragM.m.ny=dragM.ny0;dragM=null;VW.renderMarkers();renderBar();}
  // press-and-hold a marker, then drag it
  function startMarkerDrag(pid,m){
    lp=null;if(!pts.has(pid)||pts.size!==1||moved>=8||mode==='draw')return;
    const rect=viewer.getBoundingClientRect(),p=pts.get(pid);
    const sx=rect.left+VW.tx+m.nx*VW.baseW*VW.scale, sy=rect.top+VW.ty+m.ny*VW.baseH*VW.scale;
    dragM={m,pid,ox:p.x-sx,oy:p.y-sy,nx0:m.nx,ny0:m.ny,el:mklayer.querySelector(`[data-id="${m.id}"]`)};
    if(dragM.el)dragM.el.classList.add('lifted');
    panStart=null;moved=99;
    try{navigator.vibrate&&navigator.vibrate(12);}catch(_){}
    hint(I.move+`<span>Drag to move ${esc(mkCode(m))}</span>`,true);
  }
  // two fingers: zoom AND pan together, keeping the plan point under the fingers' midpoint pinned to it
  function beginPinch(){
    const a=[...pts.values()],r=viewer.getBoundingClientRect();
    startDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;startScale=VW.scale;
    const mx=(a[0].x+a[1].x)/2-r.left,my=(a[0].y+a[1].y)/2-r.top;
    gC={x:(mx-VW.tx)/VW.scale,y:(my-VW.ty)/VW.scale};
    panStart=null;moved=99;
  }
  viewer.addEventListener('pointerdown',e=>{
    if(paletteEl)closePalette();
    if(mode==='draw'){
      const isPen=e.pointerType==='pen';
      if(isPen&&!penSeen){penSeen=true;fingerDraws=false;try{localStorage.setItem('ductpro-pen','1');}catch(_){}renderBar();}
      if(drawPid!==null&&drawType==='pen'&&!isPen)return;          // palm rejection while the Pencil is down
      if(drawPid===null&&(isPen||(fingerDraws&&pts.size===0))){
        try{viewer.setPointerCapture(e.pointerId);}catch(_){}
        drawPid=e.pointerId;drawType=e.pointerType;beginStroke(e);return;
      }
      if(drawPid!==null&&drawType!=='pen'&&!isPen){                 // 2nd finger: drop the finger stroke, become a pinch/pan
        const pid=drawPid,last=cur&&cur.last;cancelStroke();
        if(last)pts.set(pid,{x:last.x,y:last.y});
      }
    }
    try{viewer.setPointerCapture(e.pointerId);}catch(_){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
    if(pts.size===1){
      panStart={x:e.clientX,y:e.clientY,tx:VW.tx,ty:VW.ty};downPt={x:e.clientX,y:e.clientY};
      if(mode!=='draw'&&mode!=='move'){const h=hitAny(e.clientX,e.clientY);
        if(h&&h.type==='marker'){const pid=e.pointerId,m=h.m;lp={pid,timer:setTimeout(()=>startMarkerDrag(pid,m),380)};}}
    }
    if(pts.size===2){cancelLP();if(dragM)cancelDrag();beginPinch();}
  });
  viewer.addEventListener('pointermove',e=>{
    if(e.pointerId===drawPid){extendStroke(e);return;}
    if(dragM&&e.pointerId===dragM.pid){
      const {nx,ny}=toNorm(e.clientX-dragM.ox,e.clientY-dragM.oy);
      dragM.m.nx=Math.max(0,Math.min(1,nx));dragM.m.ny=Math.max(0,Math.min(1,ny));
      if(dragM.el){dragM.el.style.left=(dragM.m.nx*VW.baseW)+'px';dragM.el.style.top=(dragM.m.ny*VW.baseH)+'px';}
      return;
    }
    if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&startDist&&gC){
      const a=[...pts.values()],r=viewer.getBoundingClientRect();
      const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      const mx=(a[0].x+a[1].x)/2-r.left,my=(a[0].y+a[1].y)/2-r.top;
      const ns=Math.max(0.35,Math.min(14,startScale*dist/startDist));
      VW.scale=ns;VW.tx=mx-gC.x*ns;VW.ty=my-gC.y*ns;apply();moved=99;return;
    }
    if(pts.size===1&&panStart){const dx=e.clientX-panStart.x,dy=e.clientY-panStart.y;
      moved=Math.max(moved,Math.hypot(dx,dy));if(lp&&moved>=8)cancelLP();
      VW.tx=panStart.tx+dx;VW.ty=panStart.ty+dy;apply();}
  });
  function endPt(e){
    if(e.pointerId===drawPid){
      if(e.type==='pointercancel')cancelStroke();else finishStroke();
      try{viewer.releasePointerCapture(e.pointerId);}catch(_){}
      return;
    }
    if(dragM&&e.pointerId===dragM.pid){
      const g=dragM;dragM=null;pts.delete(e.pointerId);
      try{viewer.releasePointerCapture(e.pointerId);}catch(_){}
      if(g.el)g.el.classList.remove('lifted');
      if(e.type==='pointercancel'){g.m.nx=g.nx0;g.m.ny=g.ny0;VW.renderMarkers();}
      else if(Math.abs(g.m.nx-g.nx0)>1e-5||Math.abs(g.m.ny-g.ny0)>1e-5){
        g.m.nx=+g.m.nx.toFixed(5);g.m.ny=+g.m.ny.toFixed(5);
        pPut('markers',g.m).catch(err=>{console.error(err);toast('Save failed — check connection');});
        toast(mkCode(g.m)+' moved');
      }
      renderBar();return;
    }
    if(lp&&lp.pid===e.pointerId)cancelLP();
    const wasTap=pts.size===1&&moved<8&&downPt;
    try{viewer.releasePointerCapture(e.pointerId);}catch(_){}
    pts.delete(e.pointerId);
    if(pts.size<2){startDist=0;gC=null;}
    if(pts.size===1){const p=[...pts.values()][0];panStart={x:p.x,y:p.y,tx:VW.tx,ty:VW.ty};}
    if(pts.size===0&&wasTap&&mode!=='draw'){
      if(mode==='move'&&relocM){
        const {nx,ny}=toNorm(downPt.x,downPt.y);
        if(nx<0||nx>1||ny<0||ny>1){toast('Tap on the plan');return;}
        const m=relocM;m.nx=+nx.toFixed(5);m.ny=+ny.toFixed(5);
        pPut('markers',m).catch(err=>{console.error(err);toast('Save failed — check connection');});
        setMode('view');VW.renderMarkers();toast(mkCode(m)+' moved');return;
      }
      const hit=hitAny(downPt.x,downPt.y);
      if(hit){
        if(hit.type==='report'){if(mode==='place'&&placeKind==='report')setMode('view');reportPreview(hit.r);}
        else markerSheet(hit.m,mkOpts(hit.m));
      }else if(mode==='place')placeAt(downPt.x,downPt.y);
    }
  }
  viewer.addEventListener('pointerup',endPt);
  viewer.addEventListener('pointercancel',endPt);
  viewer.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:0.9);},{passive:false});

  app.querySelector('#zin').onclick=()=>{const r=viewer.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.3);};
  app.querySelector('#zout').onclick=()=>{const r=viewer.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,0.77);};
  app.querySelector('#zfit').onclick=fitView;

  // ---- HD toggle: Quick (preview image, fast) <-> HD (render visible area from the PDF) ----
  async function loadPdf(){
    if(PDFPAGE||pdfTried)return PDFPAGE; pdfTried=true;
    if(!d.pdfChunks&&!d.pdfKey)return null;
    try{
      const bytes=await loadDrawingPdfBytes(d); if(!bytes)return null;
      const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
      PDFPAGE=await pdf.getPage((d.pageIndex||0)+1);
    }catch(e){console.warn('HD unavailable',e);}
    return PDFPAGE;
  }
  async function renderHires(){
    if(!hdOn||!PDFPAGE||!VW)return;
    const rect=viewer.getBoundingClientRect();
    const Sc=VW.scale, dpr=Math.min(3,window.devicePixelRatio||1), m=0.1;
    let bx0=(-VW.tx)/Sc, by0=(-VW.ty)/Sc, bx1=(rect.width-VW.tx)/Sc, by1=(rect.height-VW.ty)/Sc;
    const mw=(bx1-bx0)*m, mh=(by1-by0)*m; bx0-=mw;by0-=mh;bx1+=mw;by1+=mh;
    bx0=Math.max(0,bx0);by0=Math.max(0,by0);bx1=Math.min(VW.baseW,bx1);by1=Math.min(VW.baseH,by1);
    const rw=bx1-bx0, rh=by1-by0; if(rw<=1||rh<=1)return;
    const k=(d.pw||VW.baseW)/VW.baseW; let rs=Sc*dpr/k;
    let cw=Math.round(rw*k*rs), ch=Math.round(rh*k*rs);
    const MAXD=4096, MAXA=16.0e6, cap=Math.min(1, MAXD/Math.max(cw,ch), Math.sqrt(MAXA/(cw*ch)));
    if(cap<1){rs*=cap;cw=Math.round(cw*cap);ch=Math.round(ch*cap);}
    if(cw<2||ch<2)return;
    const tok=++hiresTok;
    if(curRender){try{curRender.cancel();}catch(e){}curRender=null;}
    const c=document.createElement('canvas');c.width=cw;c.height=ch;
    const vp=PDFPAGE.getViewport({scale:rs});
    const task=PDFPAGE.render({canvasContext:c.getContext('2d',{alpha:false}),viewport:vp,
      transform:[1,0,0,1,-bx0*k*rs,-by0*k*rs]});
    curRender=task;
    try{await task.promise;}catch(e){return;}
    if(tok!==hiresTok||!hdOn||!VW)return;
    hires.width=cw;hires.height=ch;hires.getContext('2d').drawImage(c,0,0);
    hires.style.left=bx0+'px';hires.style.top=by0+'px';hires.style.width=rw+'px';hires.style.height=rh+'px';hires.style.display='block';
  }
  function scheduleRerender(){
    if(!hdOn||!PDFPAGE)return;
    clearTimeout(hiresTimer);hiresTimer=setTimeout(renderHires,140);
  }
  function hdUI(){hdToggle.setAttribute('aria-pressed',hdOn?'true':'false');}
  async function setHd(on,announce){
    hdOn=on; try{localStorage.setItem('ductpro-hd',on?'1':'0');}catch(e){}
    hdUI();
    if(on){
      if(!PDFPAGE&&(d.pdfChunks||d.pdfKey)){hdToggle.classList.add('busy');await loadPdf();hdToggle.classList.remove('busy');}
      if(PDFPAGE){renderHires();if(announce)toast('HD on — sharp, re-renders as you zoom');}
      else{hdOn=false;hdUI();if(announce)toast(d.pdfChunks?'HD not available for this plan':'Re-upload this plan to use HD');}
    }else{
      hiresTok++; if(curRender){try{curRender.cancel();}catch(e){}curRender=null;}
      hires.style.display='none';
      if(announce)toast('Quick mode — fast');
    }
  }
  hdToggle.onclick=()=>setHd(!hdOn,true);
  mkToggle.onclick=hideSheet;

  vwrap.classList.toggle('hide-markups',mkHidden);mkUI();
  setBase();
  VW.renderPins();
  VW.renderMarkers();
  renderBar();
  hdUI();
  if(hdOn)setHd(true); // honor the remembered choice
  loadInk();
  if(S.focus&&S.focus.drawId===d.id){const m=S.markers.find(x=>x.id===S.focus.id);S.focus=null;if(m)requestAnimationFrame(()=>VW&&VW.focus(m));}
  window.addEventListener('resize',()=>{if(VW&&stage.isConnected){setBase();VW.renderPins();VW.renderMarkers();}},{once:false});
}

/* ---------- markup: shared helpers (palette, marker sheet, door list) ---------- */
let paletteEl=null;
function closePalette(){if(paletteEl){paletteEl.remove();paletteEl=null;}}

function markerSheet(m,{isNew=false,onChange,onMove}={}){
  const k=MK[m.kind], dr=S.drawings.find(x=>x.id===m.drawId), isNote=m.kind==='note';
  const size0=normDoor(m.doorSize), qty0=Math.max(1,+m.doorQty||1);
  const meta=[dr?dr.name:'', m.group?groupById(m.group).name:'', m.by?userName(m.by):''].filter(Boolean).join(' · ');
  const body=document.createElement('div');
  body.innerHTML=`
    <div class="mk-head"><span class="ic ${m.kind}">${I[k.icon]}</span>
      <div style="flex:1;min-width:0"><b>${esc(k.label)} ${esc(mkCode(m))}</b><span>${esc(meta)}</span></div>
      ${onMove&&!isNew?`<button type="button" class="btn ghost" id="mkMove" style="min-height:40px;padding:0 12px;font-size:14px">${I.move} Move</button>`:''}</div>
    ${onMove&&!isNew?'<div class="hintline" style="margin:-6px 0 14px">Tip: press and hold a marker on the plan to drag it.</div>':''}
    ${isNote?`<div class="field" style="margin-bottom:4px"><label>Note</label>
        <textarea class="inp" id="mkNote" rows="5" placeholder="Type a note…">${esc(m.note||'')}</textarea></div>`
    :`<div class="field"><label>Access door size needed <span style="color:var(--faint);font-weight:400">(optional)</span></label>
      <div class="chips" id="mkChips">${DOOR_SIZES.map(s=>`<button type="button" data-s="${s}" class="${size0===s?'on':''}">${s}</button>`).join('')}</div>
      <input class="inp mono" id="mkSize" placeholder="Other size, e.g. 20×14" autocomplete="off" value="${esc(DOOR_SIZES.includes(size0)?'':size0)}"></div>
    <div class="field" id="mkQtyF" ${size0?'':'hidden'}><label>Doors needed here</label>
      <div class="qty"><button type="button" id="qm" aria-label="Fewer">−</button><input id="mkQty" inputmode="numeric" value="${qty0}"><button type="button" id="qp" aria-label="More">+</button></div></div>
    <div class="field" style="margin-bottom:4px"><label>Note <span style="color:var(--faint);font-weight:400">(optional)</span></label>
      <textarea class="inp" id="mkNote" placeholder="${m.kind==='exhaust'?'e.g. EF-3 on roof, needs ladder':'e.g. above ceiling grid, cut in from hallway'}">${esc(m.note||'')}</textarea></div>`}`;
  const foot=document.createElement('div');foot.style.cssText='display:flex;gap:10px;width:100%';
  const left=document.createElement('button');
  if(isNew){left.className='btn ghost block';left.textContent=isNote?'Cancel':'Skip';}
  else{left.className='btn danger';left.innerHTML=I.trash;left.setAttribute('aria-label','Delete');}
  const save=document.createElement('button');save.className='btn primary block';save.textContent='Save';
  foot.append(left,save);
  const ctl=sheetShell({title:isNew?k.label+' placed':k.label,bodyNode:body,footNode:foot});
  const noteIn=body.querySelector('#mkNote');
  if(isNote&&isNew){try{noteIn.focus({preventScroll:true});}catch(e){}setTimeout(()=>noteIn.focus(),300);}
  const mvBtn=body.querySelector('#mkMove');if(mvBtn)mvBtn.onclick=()=>{ctl.close();onMove();};
  let curSize=()=>'';
  if(!isNote){
    const sizeIn=body.querySelector('#mkSize'),qtyF=body.querySelector('#mkQtyF'),qtyIn=body.querySelector('#mkQty');
    curSize=()=>{const on=body.querySelector('#mkChips .on');return on?on.dataset.s:normDoor(sizeIn.value);};
    const syncQty=()=>{qtyF.hidden=!curSize();};
    body.querySelectorAll('#mkChips button').forEach(b=>b.onclick=()=>{const was=b.classList.contains('on');
      body.querySelectorAll('#mkChips button').forEach(x=>x.classList.remove('on'));if(!was){b.classList.add('on');sizeIn.value='';}syncQty();});
    sizeIn.oninput=()=>{if(sizeIn.value.trim())body.querySelectorAll('#mkChips button').forEach(x=>x.classList.remove('on'));syncQty();};
    body.querySelector('#qm').onclick=()=>{qtyIn.value=Math.max(1,(parseInt(qtyIn.value)||1)-1);};
    body.querySelector('#qp').onclick=()=>{qtyIn.value=Math.min(99,(parseInt(qtyIn.value)||1)+1);};
  }
  const removeIt=()=>{S.markers=S.markers.filter(x=>x.id!==m.id);pDel('markers',m.id).catch(()=>{});renumberMarkers(m.jobId,m.kind);if(onChange)onChange();};
  left.onclick=async()=>{
    ctl.close();
    if(isNew){if(isNote&&!noteIn.value.trim())removeIt();return;}   // an empty new note is discarded
    if(await confirmDialog({title:'Delete '+(isNote?'note':'marker')+'?',message:k.label+' '+mkCode(m)+' will be removed.',confirmText:'Delete'})){
      removeIt();toast(isNote?'Note deleted':'Marker deleted');
    }
  };
  save.onclick=()=>{
    if(!isNote){m.doorSize=curSize();const q=body.querySelector('#mkQty');m.doorQty=m.doorSize?Math.max(1,Math.min(99,parseInt(q.value)||1)):1;}
    m.note=noteIn.value.trim();
    pPut('markers',m).catch(e=>{console.error(e);toast('Save failed — check connection');});
    ctl.close();if(onChange)onChange();toast('Saved');
  };
}

    +groupIds.map(id=>{const g=groupById(id);const who=g.ownerId&&(!S.user||g.ownerId!==S.user.id)?' · '+shortName(g.ownerId):'';

}
function markerRow(m){
  const dr=S.drawings.find(x=>x.id===m.drawId),q=Math.max(1,+m.doorQty||1),sz=normDoor(m.doorSize);
  const detail=m.kind==='note'?(m.note||'(no text)'):[sz?sz+(q>1?' ×'+q:''):'',m.note].filter(Boolean).join(' · ');

const KIND_LIST_TITLE={access:'Cleaning access tags',exhaust:'Exhaust tags',note:'Notes'};
function markerListSheet(jobId,kind){
  let gf='all';const body=document.createElement('div');
  const ctl=sheetShell({title:KIND_LIST_TITLE[kind],bodyNode:body,full:true});
  const draw=()=>{
    const all=jobMarkers(jobId).filter(m=>m.kind===kind).sort((a,b)=>a.num-b.num);
    const gids=[...new Set(all.map(mkGroupOf))];if(gf!=='all'&&!gids.includes(gf))gf='all';
    const list=gf==='all'?all:all.filter(m=>mkGroupOf(m)===gf);
    body.innerHTML=groupChips(gids,gf)+(list.length?list.map(markerRow).join('')
      :`<div class="empty" style="padding:28px 10px"><div class="ic">${I[MK[kind].icon]}</div><h2>None yet</h2><p>Add them with Markup on a plan.</p></div>`);
    body.querySelectorAll('[data-gf]').forEach(b=>b.onclick=()=>{gf=b.dataset.gf;draw();});
    body.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const m=S.markers.find(x=>x.id===b.dataset.m);if(!m)return;ctl.close();focusMarker(m);});
  };draw();
}
function reportsListSheet(jobId){

/* ---------- markup groups: who's signed in, your groups, show/hide by group or person ---------- */
function layersSheet(jobId,{onChange,strokeGroups=[]}={}){
  const body=document.createElement('div');
  const ctl=sheetShell({title:'Markup groups',bodyNode:body,full:true});
  const changed=()=>{if(onChange)onChange();draw();};
  const eye=on=>on?I.eye:I.eyeoff;
  function row(g,mine){
    const vis=groupVisible(g.id),active=mine&&activeGroup().id===g.id;
    return `<div class="lyr${vis?'':' off'}">
      <i class="dot" style="background:${g.color}"></i>
      <button type="button" class="nm"${mine?` data-use="${g.id}"`:''}>${esc(g.name)}${active?'<span>New markups go here</span>':''}</button>
      ${mine?`<button type="button" class="ib" data-edit="${g.id}" aria-label="Rename or delete ${esc(g.name)}">${I.edit}</button>`:''}
      <button type="button" class="ib" data-eye="${g.id}" aria-label="${vis?'Hide':'Show'} ${esc(g.name)}">${eye(vis)}</button></div>`;
  }
  function draw(){
    const used=new Set([...jobMarkers(jobId).map(mkGroupOf),...strokeGroups]);
    const others={};let legacy=false;
    used.forEach(id=>{if(id===LEGACY){legacy=true;return;}const g=groupById(id);if(S.user&&g.ownerId===S.user.id)return;
      (others[g.ownerId||'?']=others[g.ownerId||'?']||[]).push(g);});
    let h=`<div class="lyr-me">${I.user}<span>Signed in as <b>${esc(userName(S.user.id))}</b></span>
        <button type="button" class="btn ghost" id="lySwitch">Switch</button></div>
      <div class="lyr-sec">Your groups</div>`+myGroups().map(g=>row(g,true)).join('')
      +`<button type="button" class="addrow" id="lyNew">${I.plus} New group</button>`;
    Object.keys(others).forEach(o=>{const gs=others[o],anyVis=gs.some(g=>groupVisible(g.id));
      h+=`<div class="lyr-sec lyr-person"><span>${esc(o==='?'?'Unknown':userName(o))}</span>
          <button type="button" class="ib" data-person="${o}" aria-label="${anyVis?'Hide':'Show'} all">${eye(anyVis)}</button></div>`
        +gs.map(g=>row(g,false)).join('');});
    if(legacy)h+=`<div class="lyr-sec">Before names</div>`+row(groupById(LEGACY),false);
    body.innerHTML=h;
    body.querySelector('#lySwitch').onclick=()=>signInSheet(changed);
    body.querySelector('#lyNew').onclick=()=>groupNameSheet(null,name=>{const g=createGroup(name);setActiveGroup(g.id);changed();});
    body.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const id=b.dataset.eye;setGroupsHidden([id],groupVisible(id));changed();});
    body.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{const gs=others[b.dataset.person];
      setGroupsHidden(gs.map(g=>g.id),gs.some(g=>groupVisible(g.id)));changed();});
    body.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{setActiveGroup(b.dataset.use);setGroupsHidden([b.dataset.use],false);changed();});
    body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const g=S.groups.find(x=>x.id===b.dataset.edit);if(g)editGroupSheet(g,changed);});
  }
  draw();
}

function editGroupSheet(g,changed){
  const body=document.createElement('div');body.className='actionlist';
  const rn=mkAction(I.edit,'Rename');const del=mkAction(I.trash,'Delete group and its markups','danger');
  body.append(rn,mkDiv(),del);

  del.onclick=async()=>{ctl.close();
    if(myGroups().length<=1){toast('Keep at least one group — rename it instead');return;}
    const ms=S.markers.filter(m=>m.group===g.id);
    if(!await confirmDialog({title:'Delete group?',message:`“${g.name}” and its ${ms.length} marker${ms.length!==1?'s':''} and drawings will be removed from every job.`,confirmText:'Delete'}))return;
    const jobs=new Set(ms.map(m=>m.jobId));

    S.groups=S.groups.filter(x=>x.id!==g.id);pDel('mkgroups',g.id).catch(()=>{});

// swap a plan's PDF (e.g. a clean markup-free copy) while keeping the same plan id,
// so every pin/report stays exactly where it is
async function replacePlanPdf(d,file){
  const boot=document.getElementById('boot');boot.style.display='grid';
  let pdf,preview,vp1,numPages;
  try{
    const buf=await file.arrayBuffer();
    pdf=await pdfjsLib.getDocument({data:buf}).promise;numPages=pdf.numPages;
    const page=await pdf.getPage(1);vp1=page.getViewport({scale:1});preview=await renderPagePreview(page);
  }catch(e){boot.style.display='none';console.error(e);toast('Could not read that PDF');return;}
  boot.style.display='none';
  const nPins=drawReports(d.id).length;
  const body=document.createElement('div');
  body.innerHTML=`
    <div style="border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;background:var(--surface-2)">
      <img src="${preview.url}" alt="New plan preview" style="width:100%;display:block;max-height:240px;object-fit:contain"></div>
    <p style="color:var(--muted);font-size:14.5px;line-height:1.55;margin:0">
      This replaces the drawing for <b>${esc(d.name)}</b>. All ${nPins} pin${nPins!==1?'s':''} and their reports stay exactly where they are —
      use it to swap in a clean copy of the same drawing.${numPages>1?' Only page 1 of the new PDF is used.':''}</p>`;
  const foot=document.createElement('div');foot.style.display='flex';foot.style.gap='10px';foot.style.width='100%';
  const cancel=document.createElement('button');cancel.className='btn ghost block';cancel.textContent='Cancel';
  const ok=document.createElement('button');ok.className='btn primary block';ok.textContent='Replace';
  foot.append(cancel,ok);
  const ctl=sheetShell({title:'Replace PDF',bodyNode:body,footNode:foot,full:true});
  cancel.onclick=ctl.close;
  ok.onclick=async()=>{
    ok.disabled=true;cancel.disabled=true;ok.textContent='Saving…';
    const oldKey=d.pdfKey, oldLegacy=!d.pdfKey&&d.pdfChunks, newKey=uid();
    let chunks; try{chunks=await fileToPdfChunks(file);}catch(e){ok.disabled=false;cancel.disabled=false;ok.textContent='Replace';toast('Could not read that PDF');return;}
    try{
      for(let i=0;i<chunks.length;i++){ok.textContent='Saving… '+(i+1)+'/'+chunks.length;await pPut('pdfchunks',{id:newKey+'_'+i,pdfKey:newKey,jobId:d.jobId,idx:i,data:chunks[i]});}
      d.img=preview.url;d.w=preview.w;d.h=preview.h;d.pw=vp1.width;d.ph=vp1.height;d.pdfKey=newKey;d.pageIndex=0;d.pdfChunks=chunks.length;
      await pPut('drawings',d);
    }catch(e){console.error(e);ok.disabled=false;cancel.disabled=false;ok.textContent='Replace';toast('Replace failed — check connection');return;}
    if(oldKey)await deletePdfKeyIfUnused(oldKey);
    else if(oldLegacy){try{const ts=await pdfChunksByDraw(d.id);for(const t of ts)await pDel('pdfchunks',t.id);}catch(e){console.warn(e);}}
    ctl.close();VW=null;render();toast('Plan replaced — tags kept');
  };
}

  }
  renderPhotos('before');renderPhotos('after');
  // load existing photos for this report (their own docs) and show them
  if(!isNew&&((w.before&&w.before.length)||(w.after&&w.after.length))){
    photosByReport(w.id).then(docs=>{
      const byId={};docs.forEach(p=>{byId[p.id]=p;origIds.add(p.id);});
      ['before','after'].forEach(which=>{
        PH[which]=(w[which]||[]).map(id=>byId[id]).filter(Boolean).map(p=>({id:p.id,data:p.data}));
        renderPhotos(which);
      });
    }).catch(e=>console.warn('photo load failed',e));
  }

  // delete
  delBtn.onclick=async()=>{ctl.close();
    if(await confirmDialog({title:'Delete report?',message:'Report #'+w.num+' and its photos will be removed.',confirmText:'Delete'})){
      try{const ids=[...(r.before||[]),...(r.after||[])];for(const id of ids)await pDel('photos',id);}catch(e){console.warn(e);}
      await pDel('reports',r.id);S.reports=S.reports.filter(x=>x.id!==r.id);renumberReports(r.drawId);if(VW&&VW.renderPins)VW.renderPins();render();toast('Report deleted');
    }};

  // save: write each new photo as its own Firestore doc, keep order as id arrays on the report
  saveBtn.onclick=async()=>{
    w.type=typeSel.value;
    w.typeOther = w.type==='Other' ? typeOther.value.trim() : '';
    if(w.type==='Other' && !w.typeOther){toast('Enter the type');typeOther.focus();return;}
    w.revisit=body.querySelector('#r_revisit').value;
    w.area=body.querySelector('#r_area').value.trim();
    w.equipment=w.equipment.filter(eq=>eq.item.trim()||eq.notes.trim());
    if(!w.equipment.length)w.equipment=[];
    delete w.draft;delete w.sig;delete w.sigName;delete w.sigRole;delete w.sigAt;delete w.name;delete w.assignee;
    saveBtn.disabled=true;saveBtn.textContent='Saving…';
    const bootEl=document.getElementById('boot');bootEl.style.display='grid';
    const fail=(m)=>{bootEl.style.display='none';saveBtn.disabled=false;saveBtn.textContent=isNew?'Save report':'Save changes';toast(m);};
    try{
      const keep=new Set();
      for(const which of ['before','after']){
        for(const p of PH[which]){
          if(!p.id){p.id=uid();await pPut('photos',{id:p.id,reportId:w.id,jobId:w.jobId,which,data:p.data,createdAt:now()});}
          keep.add(p.id);
        }
      }
      // remove photos the tech deleted
      for(const id of origIds){if(!keep.has(id))await pDel('photos',id);}
      w.before=PH.before.map(p=>p.id);
      w.after=PH.after.map(p=>p.id);
    }catch(e){console.error(e);return fail('Photo save failed — check connection');}
    try{await pPut('reports',w);}
    catch(e){console.error(e);return fail('Save failed — check connection');}
    const exists=S.reports.find(x=>x.id===w.id);
    if(exists)Object.assign(exists,w);else S.reports.push(w);
    bootEl.style.display='none';
    ctl.close();if(VW&&VW.renderPins)VW.renderPins();render();toast(isNew?'Report saved':'Saved');
  };
}

function expMode(){try{const m=localStorage.getItem('ductpro-exp-mode');if(m==='reports'||m==='markups'||m==='both')return m;}catch(e){}return 'reports';}

async function exportInteractivePdf(j,btn,status,mode,planIds,mkTypes){
  mkTypes=mkTypes||{exhaust:true,access:true,note:true,draw:true};
  if(!window.PDFLib){toast('PDF engine still loading — try again');return;}
  const content=mode==='markups'?{reports:false,markups:true}
    :mode==='both'?{reports:true,markups:true}:{reports:true,markups:false};
  const dlLabel=I.download+' Download PDF';
  btn.disabled=true;const reset=()=>{btn.disabled=false;btn.innerHTML=dlLabel;};
  const set=t=>{btn.textContent=t;if(status)status.textContent=t;};
  set('Loading plans…');
  try{
    let draws=jobDrawings(j.id);
    if(planIds&&planIds.length)draws=draws.filter(d=>planIds.includes(d.id));
    if(!draws.length){toast('Add a plan first');reset();return;}
    // photos only needed for report pages
    let photoBytes={};
    if(content.reports){try{(await photosByJob(j.id)).forEach(p=>{try{photoBytes[p.id]=dataUrlToBytes(p.data);}catch(e){}});}catch(e){console.warn(e);}}
    // markups: freehand strokes (loaded on demand) + tags (already in state), grouped by plan
    let strokesByDrawId={};
    if(content.markups&&mkTypes.draw){try{(await strokesByJob(j.id)).forEach(st=>{(strokesByDrawId[st.drawId]=strokesByDrawId[st.drawId]||[]).push(st);});
      Object.values(strokesByDrawId).forEach(a=>a.sort((x,y)=>x.createdAt-y.createdAt));}catch(e){console.warn(e);}}
    let logoPng=null;try{logoPng=await fetchBytes('logo.png');}catch(e){}
    const plans=[];
    for(let di=0;di<draws.length;di++){
      const d=draws[di];set(`Loading plan ${di+1}/${draws.length}…`);
      let pdfBytes=null;
      if(d.pdfChunks||d.pdfKey){try{pdfBytes=await loadDrawingPdfBytes(d);}catch(e){console.warn(e);}}
      const reports=content.reports?drawReports(d.id).map(r=>({
        num:r.num,type:r.type,typeOther:r.typeOther,status:r.status,revisit:r.revisit,
        equipment:r.equipment,area:r.area,nx:r.nx,ny:r.ny,
        before:(r.before||[]).map(id=>photoBytes[id]).filter(Boolean),
        after:(r.after||[]).map(id=>photoBytes[id]).filter(Boolean),
      })):[];
      const markers=content.markups?drawMarkers(d.id).filter(m=>mkTypes[m.kind]).sort(byNumThenAge):[];
      const strokes=(content.markups&&mkTypes.draw)?(strokesByDrawId[d.id]||[]):[];
      plans.push({name:d.name,pdfBytes,pageIndex:d.pageIndex||0,imgBytes:pdfBytes?null:dataUrlToBytes(d.img),pw:d.w,ph:d.h,reports,markers,strokes});
    }
    set('Building PDF…');
    const bytes=await makeExportPdf(PDFLib,{job:j,company:COMPANY,plans,logoPng,content});
    const tag=mode==='markups'?' markups':mode==='both'?' full':'';
    const fname=(j.name+' '+j.number).replace(/[^\w .\-]+/g,'').trim()+tag+' — Arctic.pdf';
    set('');reset();
    const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    const a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),15000);
    toast('PDF downloaded');
  }catch(e){
    console.error(e);set('');reset();toast('Export failed — try again');
  }
}

// ---- markup rendering helpers for export (standalone copies of the viewer's path math) ----
const _ef1=n=>Math.round(n*10)/10;
function _expLinePath(P){
  if(P.length===1)return `M${_ef1(P[0][0])},${_ef1(P[0][1])}l0.01,0`;
  let s=`M${_ef1(P[0][0])},${_ef1(P[0][1])}`;
  for(let i=1;i<P.length-1;i++){const mx=(P[i][0]+P[i+1][0])/2,my=(P[i][1]+P[i+1][1])/2;s+=`Q${_ef1(P[i][0])},${_ef1(P[i][1])} ${_ef1(mx)},${_ef1(my)}`;}
  const L=P[P.length-1];return s+`L${_ef1(L[0])},${_ef1(L[1])}`;
}
function _expOutlinePath(P,w){
  const n=P.length,W=P.map(p=>w*(0.45+1.1*(p[2]==null?0.5:p[2])));
  for(let k=0;k<2;k++)for(let i=1;i<n-1;i++)W[i]=(W[i-1]+W[i]*2+W[i+1])/4;
  if(n===1){const r=W[0]/2,x=P[0][0],y=P[0][1];
    return `M${_ef1(x-r)},${_ef1(y)}a${_ef1(r)},${_ef1(r)} 0 1,0 ${_ef1(2*r)},0a${_ef1(r)},${_ef1(r)} 0 1,0 ${_ef1(-2*r)},0Z`;}
  const Lp=[],Rp=[];
  for(let i=0;i<n;i++){const a=P[Math.max(0,i-1)],b=P[Math.min(n-1,i+1)];
    let dx=b[0]-a[0],dy=b[1]-a[1];const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;
    const r=W[i]/2;Lp.push([P[i][0]-dy*r,P[i][1]+dx*r]);Rp.push([P[i][0]+dy*r,P[i][1]-dx*r]);}
  const sm=Q=>{let s='';for(let i=1;i<Q.length-1;i++){const mx=(Q[i][0]+Q[i+1][0])/2,my=(Q[i][1]+Q[i+1][1])/2;
    s+=`Q${_ef1(Q[i][0])},${_ef1(Q[i][1])} ${_ef1(mx)},${_ef1(my)}`;}const Z=Q[Q.length-1];return s+`L${_ef1(Z[0])},${_ef1(Z[1])}`;};
  const Rr=Rp.slice().reverse(),re=W[n-1]/2,rs=W[0]/2;
  return `M${_ef1(Lp[0][0])},${_ef1(Lp[0][1])}`+sm(Lp)+`A${_ef1(re)},${_ef1(re)} 0 0,0 ${_ef1(Rr[0][0])},${_ef1(Rr[0][1])}`
    +sm(Rr)+`A${_ef1(rs)},${_ef1(rs)} 0 0,0 ${_ef1(Lp[0][0])},${_ef1(Lp[0][1])}Z`;
}
// stroke -> {path, w(in svg units), hl} for a page pw x ph (scale pw/1000 maps it onto the page)
function strokeExportPath(st,pw,ph){
  const a=ph/pw,P=[];
  for(let i=0;i<(st.pts||[]).length;i+=3)P.push([st.pts[i]*1000,st.pts[i+1]*1000*a,st.pts[i+2]]);
  if(!P.length)return null;
  const w=(st.w||0.004)*1000;
  return st.tool==='hl'?{path:_expLinePath(P),w,hl:true}:{path:_expOutlinePath(P,w),w,hl:false};
}
const MK_LETTER={exhaust:'E',access:'A',note:'N'};
function mkExportLabel(m){
  if(m.kind==='note'){const t=String(m.note||'').replace(/\s+/g,' ').trim();return t.length>44?t.slice(0,43)+'…':t;}
  const sz=normDoor(m.doorSize),q=Math.max(1,+m.doorQty||1);return sz?sz+(q>1?' \u00d7'+q:''):'';
}
// ---- interactive-PDF builder (validated against real E-size sheets) ----
async function makeExportPdf(PDFLib,{job,company,plans,logoPng,content}){
  content=content||{reports:true,markups:false};
  const {PDFDocument, rgb, StandardFonts, PDFName, LineCapStyle, BlendMode}=PDFLib;
  const out=await PDFDocument.create();
  const helv=await out.embedFont(StandardFonts.Helvetica);
  const helvB=await out.embedFont(StandardFonts.HelveticaBold);
  let logo=null; try{ if(logoPng) logo=await out.embedPng(logoPng); }catch(e){}
  const GREEN=rgb(0.08,0.60,0.42), AMBER=rgb(0.77,0.49,0.08), INK=rgb(0.1,0.12,0.14), MUT=rgb(0.45,0.5,0.55), WHITE=rgb(1,1,1);
  const MK_COL={exhaust:rgb(0.486,0.227,0.914),access:rgb(0.031,0.569,0.698),note:rgb(0.859,0.153,0.467)};
  const hexRgb=h=>{h=String(h||'').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
    const n=parseInt(h,16);return isNaN(n)?rgb(0.1,0.1,0.1):rgb(((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255);};
  const wrap=(txt,font,size,maxw)=>{const words=String(txt||'').split(/\s+/);const lines=[];let ln='';
    for(const w of words){const t=ln?ln+' '+w:w;if(font.widthOfTextAtSize(t,size)>maxw&&ln){lines.push(ln);ln=w;}else ln=t;}
    if(ln)lines.push(ln);return lines;};
  function drawReportPage(pg,r,plan){
    const W=pg.getWidth(),H=pg.getHeight(),M=48; let y=H-M;
    if(logo){const lw=96,lh=lw*(logo.height/logo.width);pg.drawImage(logo,{x:M,y:y-lh+6,width:lw,height:lh});}
    else{pg.drawText(company||'Arctic',{x:M,y:y-6,size:20,font:helvB,color:INK});}
    pg.drawText('Duct Post Inspection',{x:W-M-helv.widthOfTextAtSize('Duct Post Inspection',11),y:y-2,size:11,font:helv,color:MUT});
    const idn='#'+r.num; pg.drawText(idn,{x:W-M-helvB.widthOfTextAtSize(idn,22),y:y-26,size:22,font:helvB,color:INK});
    y-=44;
    const sub=(job.name||'')+'  \u00b7  '+(job.number||'')+(job.address?('  \u00b7  '+job.address.replace(/\n/g,', ')):'');
    pg.drawText(sub,{x:M,y,size:9.5,font:helv,color:MUT}); y-=16;
    pg.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:2,color:rgb(0.12,0.5,0.85)}); y-=24;
    const row=(k,v,vcol)=>{const lines=wrap(v,helvB,11,W-M-150);pg.drawText(k,{x:M,y,size:10,font:helv,color:MUT});
      lines.forEach((ln,i)=>pg.drawText(ln,{x:M+100,y:y-i*14,size:11,font:helvB,color:vcol||INK}));y-=Math.max(20,14*lines.length+6);};
    row('Type', r.type==='Other'?(r.typeOther||'Other'):(r.type||'\u2014'));
    row('Status', r.status, r.status==='Completed'?GREEN:AMBER);
    row('Plan', plan.name);
    if(r.revisit) row('Re-visit', r.revisit);
    const eq=(r.equipment||[]).filter(e=>e.item||e.notes);
    if(eq.length){y-=6;pg.drawText('SERVICED EQUIPMENT',{x:M,y,size:10,font:helvB,color:INK});y-=16;
      eq.forEach(e=>{pg.drawText(e.item||'\u2014',{x:M,y,size:10.5,font:helvB,color:INK});
        const nl=wrap(e.notes||'',helv,10,W-M*2-12);nl.forEach((ln,i)=>pg.drawText(ln,{x:M+12,y:y-14-i*13,size:10,font:helv,color:MUT}));
        y-=16+nl.length*13+6;});}
    if(r.area){y-=4;pg.drawText('INSPECTED AREA',{x:M,y,size:10,font:helvB,color:INK});y-=15;
      wrap(r.area,helv,10.5,W-M*2).forEach(ln=>{pg.drawText(ln,{x:M,y,size:10.5,font:helv,color:INK});y-=14;});}
    const strip=(label,imgs)=>{if(!imgs||!imgs.length)return;y-=10;
      pg.drawText(label,{x:M,y,size:10,font:helvB,color:INK});y-=6;
      const gap=8,cols=3,cw=(W-M*2-gap*(cols-1))/cols,chh=cw*0.75;let x=M,placed=0;
      for(const im of imgs){if(placed&&placed%cols===0){x=M;y-=chh+gap;}try{pg.drawImage(im,{x,y:y-chh,width:cw,height:chh});}catch(e){}x+=cw+gap;placed++;}
      y-=chh+gap;};
    strip('BEFORE', r.beforeImg); strip('AFTER', r.afterImg);
  }
  // draw the markup layer (freehand strokes + tags) onto a plan page
  function drawMarkups(pg,plan){
    const pw=pg.getWidth(), ph=pg.getHeight(), S=pw/1000;
    for(const st of (plan.strokes||[])){
      let g;try{g=strokeExportPath(st,pw,ph);}catch(e){continue;}
      if(!g)continue;
      try{
        if(g.hl)pg.drawSvgPath(g.path,{x:0,y:ph,scale:S,borderColor:hexRgb(st.color),borderWidth:g.w,
          borderOpacity:0.4,borderLineCap:LineCapStyle.Round,blendMode:BlendMode.Multiply});
        else pg.drawSvgPath(g.path,{x:0,y:ph,scale:S,color:hexRgb(st.color)});
      }catch(e){}
    }
    for(const m of (plan.markers||[])){
      const x=m.nx*pw, y=(1-m.ny)*ph, R=Math.max(9,pw*0.0082);
      const col=MK_COL[m.kind]||MK_COL.note;
      pg.drawCircle({x,y,size:R,color:col,opacity:0.45,borderColor:col,borderWidth:Math.max(1.3,R*0.2),borderOpacity:1});
      const letter=MK_LETTER[m.kind]||'?', fs=R*1.02, tw=helvB.widthOfTextAtSize(letter,fs);
      pg.drawText(letter,{x:x-tw/2,y:y-fs*0.35,size:fs,font:helvB,color:WHITE});
      const label=mkExportLabel(m);
      if(label){const ls=Math.max(8,R*0.9),lw=helvB.widthOfTextAtSize(label,ls),padx=4,lx=x+R+5;
        pg.drawRectangle({x:lx-padx,y:y-ls*0.75,width:lw+padx*2,height:ls*1.65,color:WHITE,opacity:0.82,
          borderColor:col,borderWidth:0.7,borderOpacity:0.55});
        pg.drawText(label,{x:lx,y:y-ls*0.32,size:ls,font:helvB,color:col});}
    }
  }
  async function embedJpgs(list){const a=[];for(const bz of (list||[])){try{a.push(await out.embedJpg(bz));}catch(e){}}return a;}
  for(const plan of plans){
    let pg;
    if(plan.pdfBytes){const src=await PDFDocument.load(plan.pdfBytes);const pi=Math.min(plan.pageIndex||0,src.getPageCount()-1);[pg]=await out.copyPages(src,[pi]);out.addPage(pg);}
    else{let img=null;try{img=await out.embedJpg(plan.imgBytes);}catch(e){}const w=(img?img.width:plan.pw)||1200,h=(img?img.height:plan.ph)||1600;pg=out.addPage([w,h]);if(img)pg.drawImage(img,{x:0,y:0,width:w,height:h});}
    const pw=pg.getWidth(), ph=pg.getHeight();
    // strip the source plan's own annotations (e.g. old Bluebeam markups) for a clean export
    pg.node.set(PDFName.of('Annots'), out.context.obj([]));
    // markups sit under the numbered report pins
    if(content.markups)drawMarkups(pg,plan);
    if(content.reports){
      const repPages=[];
      for(const r of plan.reports){r.beforeImg=await embedJpgs(r.before);r.afterImg=await embedJpgs(r.after);
        const rp=out.addPage([612,792]);drawReportPage(rp,r,plan);repPages.push(rp);}
      const annots=[];
      plan.reports.forEach((r,i)=>{
        const x=r.nx*pw, y=(1-r.ny)*ph, R=Math.max(10,pw*0.0085);
        const col=r.status==='Completed'?GREEN:AMBER;
        pg.drawCircle({x,y,size:R,color:col,opacity:0.42,borderColor:col,borderWidth:Math.max(1.4,R*0.2),borderOpacity:1});
        const fs=R*1.0, tw=helvB.widthOfTextAtSize(String(r.num),fs);
        pg.drawText(String(r.num),{x:x-tw/2,y:y-fs*0.35,size:fs,font:helvB,color:rgb(1,1,1)});
        const LR=R*2;
        const ctx=out.context, dest=ctx.obj([repPages[i].ref, PDFName.of('Fit')]);
        const annot=ctx.obj({Type:PDFName.of('Annot'),Subtype:PDFName.of('Link'),Rect:[x-LR,y-LR,x+LR,y+LR],
          Border:[0,0,0],A:{Type:PDFName.of('Action'),S:PDFName.of('GoTo'),D:dest}});
        annots.push(ctx.register(annot));
      });
      pg.node.set(PDFName.of('Annots'), out.context.obj(annots));
    }
  }
  return await out.save();
}

/* ============================ theme ============================ */
function cycleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?'':'dark';
  if(next)document.documentElement.setAttribute('data-theme',next);else document.documentElement.removeAttribute('data-theme');
  try{localStorage.setItem('ductpro-theme',next);}catch(e){}
  toast(next?next[0].toUpperCase()+next.slice(1)+' theme':'System theme');
}
(function initTheme(){try{const t=localStorage.getItem('ductpro-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();

/* ============================ boot ============================ */
function bootError(msg){
  const el=document.getElementById('boot');
  el.style.display='grid';
  el.innerHTML='<div style="max-width:30ch;text-align:center;color:var(--muted);padding:24px">'+
    '<div style="color:var(--danger);font-weight:700;font-size:17px;margin-bottom:8px">Couldn’t connect</div>'+
    '<div style="font-size:14px;line-height:1.5">'+esc(msg)+'</div></div>';
}
// what the app loads at startup: [state key, Firestore collection]
const BOOT_STORES=[['jobs','jobs'],['drawings','drawings'],['reports','reports'],['markers','markers'],
  ['users','users'],['groups','mkgroups'],['checklist','checklist']];
// all collections at once. source 'cache' = what this phone already saved (instant, works with no signal)
async function loadStores(source){
  const out={};
  await Promise.all(BOOT_STORES.map(async([k,coll])=>{
    try{const snap=await fdb.collection(coll).get(source?{source}:undefined);out[k]=snap.docs.map(x=>x.data());}
    catch(e){if(k==='jobs'||k==='drawings'||k==='reports')throw e;console.warn(coll+' load failed',e);out[k]=null;}
  }));
  return out;
}
function applyStores(d){for(const k in d)if(d[k])S[k]=d[k];}
// who is using this device (asked once, by name)
function restoreUser(){
  try{const sv=JSON.parse(localStorage.getItem('ductpro-user')||'null');
    if(sv&&sv.id){let u=S.users.find(x=>x.id===sv.id);
      if(!u&&sv.first){u={id:sv.id,first:sv.first,last:sv.last||'',createdAt:sv.createdAt||now()};S.users.push(u);pPut('users',u).catch(()=>{});}
      S.user=u||null;}}catch(e){}
}
// fresh data arrived after the app was already showing: redraw without yanking anything out from under you
function refreshAfterSync(){
  const route=S.route[S.route.length-1];
  if(document.querySelector('#sheets .scrim'))return;            // a form is open; the next screen picks it up
  if(route==='drawing'){if(VW&&VW.renderPins){VW.renderPins();VW.renderMarkers();}return;}
  if(route==='export')return;
  render();
}
// Home Screen apps can hang on to an old copy of the page. If the server has a newer build, load it
// (right away at startup, otherwise the next time you're back on the home screen).
let UPDATE_READY=false;
function checkForUpdate(){
  if(BUILD.indexOf('__')===0||!window.fetch)return;
  const t0=Date.now();
  fetch(location.pathname,{cache:'reload'}).then(r=>r.ok?r.text():'').then(t=>{
    const m=t.match(/const BUILD='([^']+)'/);if(!m||m[1]===BUILD)return;
    let tried=null;try{tried=sessionStorage.getItem('ductpro-update');}catch(e){}
    if(tried===m[1])return;                                    // already reloaded for this build once; don't loop
    try{sessionStorage.setItem('ductpro-update',m[1]);}catch(e){}
    const route=S.route[S.route.length-1];
    if(Date.now()-t0<8000&&!document.querySelector('#sheets .scrim')&&(route==='jobs'||document.getElementById('boot').style.display!=='none'))location.reload();
    else UPDATE_READY=true;
  }).catch(()=>{});
}
(async function boot(){
  checkForUpdate();
  try{ await initStore(); }
  catch(e){ console.error(e); bootError('Could not reach Firebase. Check your internet connection and reload.'); return; }
  let shown=false;
  const show=()=>{restoreUser();restoreNav();render();watchChecklist();initBackButton();document.getElementById('boot').style.display='none';shown=true;};
  // 1) open with what this phone already has: no waiting on a weak signal
  try{const c=await loadStores('cache');
    if(c.jobs&&(c.jobs.length||(c.checklist&&c.checklist.length))){applyStores(c);show();}}catch(e){}
  // 2) then the latest from the server
  try{const f=await loadStores();applyStores(f);
    if(!shown)show();else{restoreUser();refreshAfterSync();}}
  catch(e){
    console.error(e);
    if(!shown)bootError('Connected to Firebase, but reads were denied. Make sure Firestore and Storage security rules allow access, then reload.');
  }
})();
</script>
